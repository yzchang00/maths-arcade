        then:()=>askOne(api,{id:'psD2',label:'Step 2: how much do you pay?',pre:'<span class="askunit">$</span>',right:pay,traps:[[D,`${pmoney(D)} is the amount you save. You still pay the rest: $${P} − ${pmoney(D)}.`],[P+D,'A discount makes the price lower, so subtract.'],[P-p,`Take away the discount in dollars (${pmoney(D)}), not ${p}.`]],
          ok:`$${P} − ${pmoney(D)} = ${pmoney(pay)}`,work:[`Discount = ${p}% of $${P} = ${pmoney(D)}`,`Price now = $${P} − ${pmoney(D)} = ${pmoney(pay)}`,`Or: you pay ${100-p}% of $${P} = ${pmoney(pay)}`]})});return}
    let off=Math.max(1,Math.round(D+pick([-1,1])*pick([2,3,4,5])));if(off===Math.round(D)&&Number.isInteger(D))off+=2;const payB=P-off,cheap=pay<payB?'A':'B',diff=Math.abs(payB-pay);
    api.q(`<p class="qt">Two shops sell the same ${item.toLowerCase()} for <b>$${P}</b>. Shop A gives <b>${p}% off</b>. Shop B gives <b>$${off} off</b>. Which shop is cheaper?</p>`);
    api.body.innerHTML=`<div class="row">${tag('Shop A · '+ic,'$'+P,`${p}% off`)}${tag('Shop B · '+ic,'$'+P,`$${off} off`)}</div><div class="choices" id="psC"></div><div id="psCM"></div>`;
    ['A','B'].forEach(x=>{const btn=document.createElement('button');btn.className='btn';btn.textContent='Shop '+x;btn.onclick=()=>{if(api.answered||btn.disabled)return;
      if(x===cheap){[...$('psC').children].forEach(y=>y.disabled=true);btn.classList.add('ok');return askOne(api,{id:'psC2',label:'How much cheaper is it?',pre:'<span class="askunit">$</span>',right:diff,traps:[[Math.abs(p-off),`Compare dollars with dollars: ${p}% of $${P} is ${pmoney(D)}, not $${p}.`]],
        ok:`Shop ${cheap} is ${pmoney(diff)} cheaper.`,work:[`Shop A: ${p}% of $${P} = ${pmoney(D)} off → ${pmoney(pay)}`,`Shop B: $${off} off → $${payB}`,`Difference: ${pmoney(diff)}`]})}
      const m=p>off&&cheap!==(p>off?'A':'B')?`${p} is bigger than ${off}, but ${p}% is not $${p}. Work out ${p}% of $${P} first.`:`Work out ${p}% of $${P} in dollars, then compare.`;
      if(api.first('psC')){btn.disabled=true;btn.classList.add('no');api.retry($('psCM'),m);return}api.done(false,m,[`Shop A: ${p}% of $${P} = ${pmoney(D)} off`,`Shop B: $${off} off`])};$('psC').appendChild(btn)});return}
  if(type==='gst'){const P=pick([20,50,80,120,150,200,300,60]),G=P*9/100;

/* ================= P6. Pie Chart Bakery — reading and solving problems with pie charts ================= */
const BAKE=[['🧁','Cupcakes','#ffb3c7'],['🍩','Donuts','#ffd27a'],['🥐','Croissants','#f3c28b'],['🍪','Cookies','#c6a07b'],['🥧','Tarts','#bcd3fb'],['🍞','Bread','#bfe8cf'],['🎂','Cakes','#d9c6ff']];
function pieSvg(secs,o={}){const R0=96;let s='',a=-90;
  secs.forEach(sc=>{const a0=a,a1=a+sc.deg;a=a1;const r0=a0*Math.PI/180,r1=a1*Math.PI/180,big=sc.deg>180?1:0;
    s+=`<path d="M0 0 L${R0*Math.cos(r0)} ${R0*Math.sin(r0)} A${R0} ${R0} 0 ${big} 1 ${R0*Math.cos(r1)} ${R0*Math.sin(r1)} Z" fill="${sc.c}" stroke="var(--ink)" stroke-width="2"/>`;
    if(sc.deg===90&&o.rightMark){const m=14;s+=`<path d="M${m*Math.cos(r0)} ${m*Math.sin(r0)} L${m*Math.SQRT2*Math.cos((r0+r1)/2)} ${m*Math.SQRT2*Math.sin((r0+r1)/2)} L${m*Math.cos(r1)} ${m*Math.sin(r1)}" fill="none" stroke="var(--ink)" stroke-width="2"/>`}
    const mid=(r0+r1)/2,lr=sc.deg<40?R0+26:R0*.6;
    s+=`<text x="${lr*Math.cos(mid)}" y="${lr*Math.sin(mid)-4}" text-anchor="middle" font-size="18">${sc.e}</text><text x="${lr*Math.cos(mid)}" y="${lr*Math.sin(mid)+14}" text-anchor="middle" font-size="13" font-weight="800" fill="#16233a" class="${sc.deg<40?'pieout':''}">${sc.lab}</text>`});
  return `<div class="piewrap"><svg class="piec" viewBox="-130 -125 260 250" role="img" aria-label="Pie chart">${s}</svg><div class="pieleg">${secs.map(sc=>`<span><i style="background:${sc.c}"></i>${sc.e} ${sc.name}</span>`).join('')}</div></div>`}
addGame('p6-pie',{level:'P6',strand:'stat',glyph:'◔',title:'Pie Chart Bakery',topic:'Pie charts',
 how:'Read the bakery’s pie charts and solve problems about what was sold.',rounds:8,
 round(api,r){
  const type=['frac','pctQty','missing','total','angleQty','more','angleOf','fromAngle'][r];
  const B=shuffle(BAKE);

  if(type==='frac'){const set=pick([[90,180,90],[90,90,120,60],[180,90,45,45],[90,120,150],[60,90,90,120]]),k=set.indexOf(90),secs=mk(set,(v,i)=>i===k?'?':'');
    api.q(`<p class="qt">The pie chart shows the items sold at a bakery. What fraction of the items sold were <b>${secs[k].name.toLowerCase()}</b>?</p><p class="qs">The small square mark means a right angle.</p>`);
    api.body.innerHTML=pieSvg(secs,{rightMark:true});
    choiceRow(api,'pbF',[fr(1,4),fr(9,10),fr(1,3),fr(90,100)],fr(1,4),ok=>{if(ok)return api.done(true,`A right angle is 90°, and ${fr(90,360)} = ${fr(1,4)}.`,[`The whole circle is 360°.`,`${fr(90,360)} = ${fr(1,4)}`]);
      api.done(false,'A whole circle is 360°, not 100. The right angle is 90° out of 360°, so it is ¼ of the pie.',[`${fr(90,360)} = ${fr(1,4)}`])},'pbF');
    const box=$('pbFM');const orig=[...$('pbF').children];orig.forEach(b=>b.addEventListener('click',()=>{if(!api.answered&&box&&box.querySelector('.retrymsg')){const t=b.innerHTML;box.innerHTML=`<p class="retrymsg">🔁 ${t===fr(9,10)||t===fr(90,100)?'A whole circle is 360°, not 100. Compare 90° with 360°.':'Look at the angle mark: it is 90°. How many 90° parts make a full circle?'}</p>`}}));return}

      else if(t===2){const a=R(2,6),b=R(2,9),cc=R(2,5);c={c:`(${a} + ${b}) × ${cc}`,a:(a+b)*cc,trap:[a+b*cc,'Brackets first!']}}
      else if(t===3){const p=pick([10,20,25,50,75]),m=pick([40,60,80,120,200]);c={c:`${p}% of ${m}`,a:p*m/100,trap:[m-p,`${p}% of ${m} is not ${m} − ${p}.`]}}
      else if(t===4){const n=R(11,99)/10,k=pick([10,100]);c={c:`${n} × ${k}`,a:Math.round(n*k),trap:[Math.round(n*k/10),`× ${k} moves the digits ${k===10?1:2} place${k===10?'':'s'} left.`]}}
      else{const b=R(4,12),h=R(2,10)*2;c={c:`area of a triangle with base ${b} cm and height ${h} cm (in cm²)`,a:b*h/2,trap:[b*h,'Triangle area is ½ × base × height. Don’t forget the ½.']}}}
    else{if(t<2){const a=R(3,13);c={c:`${a}²`,a:a*a,trap:[2*a,`${a}² is ${a} × ${a}, not ${a} × 2.`]}}
      else if(t===2){const a=R(2,5);c={c:`${a}³`,a:a**3,trap:[3*a,`${a}³ is ${a} × ${a} × ${a}.`]}}
      else if(t===3){const x=R(2,12),k=R(2,6),b=R(1,15);c={c:`x when ${k}x + ${b} = ${k*x+b}`,a:x,trap:[(k*x+b)/k-b,`Take away ${b} from both sides first, then divide by ${k}.`]}}
      else if(t===4){const [a,b]=pick([[2,3],[3,5],[1,4],[2,5],[3,4]]),u=R(3,12);c={c:`the bigger share when ${(a+b)*u} is split in the ratio ${a} : ${b}`,a:b*u,trap:[(a+b)*u/b,`Total units = ${a} + ${b} = ${a+b}. 1 unit = ${(a+b)*u} ÷ ${a+b}.`]}}
      else{const p=pick([10,20,25,50]),n=pick([40,60,80,120,160]);c={c:`${n} increased by ${p}%`,a:n+n*p/100,trap:[n*p/100,'That is only the increase. Add it on.']}}}
    add(c)}
  return out}
addGame('party-bingo',{level:'All levels',strand:'party',glyph:'🎱',title:'Number Bingo',topic:'Whole-class or solo bingo with maths clues',

const lines4=[...[0,1,2,3].map(r=>[0,1,2,3].map(c=>r*4+c)),...[0,1,2,3].map(c=>[0,1,2,3].map(r=>r*4+c)),[0,5,10,15],[3,6,9,12]];
function bingoGame(stage,mode,o){const clues=shuffle(bingoClues(o.sel.bgK||'P4')),answers=clues.map(c=>c.a),bot=mode==='bot';
  const mine=shuffle(answers).slice(0,16),rob=shuffle(answers).slice(0,16),S={i:-1,mk:new Set(),rk:new Set(),over:false,miss:[],calls:0};

  const won=set=>lines4.some(l=>l.every(i=>set.has(i)));

    $('bgC').innerHTML=`<span class="tag">Call ${S.i+1} of ${clues.length}</span><div class="bgclue">${c.c}</div>`;$('bgM').innerHTML='';sfx.pop();
    if(bot){const k=rob.indexOf(c.a);if(k>=0)PT.timer(()=>{{S.rk.add(k);$('bgRob').children[k].classList.add('on');if(won(S.rk))end(1)}},900+Math.random()*900)}};
  const wrong=msg=>{sfx.no();if(S.first){S.first=false;$('bgM').innerHTML=`<p class="retrymsg">🔁 ${msg}</p>`;return}
    const c=clues[S.i];S.miss.push(`${c.c} = ${c.a}`);$('bgM').innerHTML=`<p class="retrymsg">❌ The answer was <b>${c.a}</b>. ${mine.includes(c.a)?'It was on your card, but this chance is gone.':'It was not on your card.'}</p>`;PT.timer(next,2200)};
  $('bgMine').querySelectorAll('.bgcell').forEach(b=>b.onclick=()=>{if(S.over||S.i<0||b.classList.contains('on'))return;const c=clues[S.i],v=+b.textContent;
    if(v===c.a){b.classList.add('on');S.mk.add(+b.dataset.i);sfx.ok();$('bgM').innerHTML='';if(won(S.mk))return end(0);PT.timer(next,500);return}
    b.classList.add('shake');PT.timer(()=>b.classList.remove('shake'),400);wrong(c.trap&&v===c.trap[0]?c.trap[1]:`${v} is not the answer to “${c.c}”. Work it out again.`)});
  $('bgNo').onclick=()=>{if(S.over||S.i<0)return;const c=clues[S.i];if(!mine.includes(c.a)){sfx.tap();$('bgM').innerHTML=`<p class="asknote">Right, ${c.a} is not on your card.</p>`;PT.timer(next,900);return}
    wrong('Look again. The answer <b>is</b> on your card. Work the clue out carefully.')};
  const end=w=>{if(S.over)return;S.over=true;const lines=[`Calls used: ${S.calls}`];if(S.miss.length)lines.push(`<b>Clues to look at again:</b><br>${S.miss.join('<br>')}`);
    if(w===0)setBest('party-bingo',S.calls<=14?3:S.calls<=19?2:1);
    if(w===0)setTimeout(()=>arcReport('party-bingo',Math.max(1,30-S.calls),{mode}),80);partyEnd(stage,w===0?'BINGO! You win! 🏆':w===1?'🤖 Robo got Bingo first!':'Out of clues!',lines,()=>bingoGame(stage,mode,o))};
  PT.timer(next,600)}

/* ---------- Fraction Wall Race ---------- */
const FW=[[1,2],[1,3],[1,4],[1,6],[1,12],[2,3],[3,4],[5,12],[1,6],[1,4],[1,3],[1,12],[5,6],[7,12]];
const FWROWS=[1,2,3,4,6,12];
function fwWall(){return `<div class="fwref">${FWROWS.map(d=>`<div class="fwr">${Array.from({length:d},()=>`<span>${d===1?'1':fr(1,d)}</span>`).join('')}</div>`).join('')}</div>`}
addGame('party-wall',{level:'All levels',strand:'party',glyph:'🧱',title:'Fraction Wall Race',topic:'Equivalent fractions and adding fractions',
 how:'Take turns to add fraction bricks to your wall. Fill exactly 2 whole bars first to win.',rounds:1,
 modes:[['solo','vs Robot'],['bot','vs Robot'],['pass','2 players']],
 custom(stage,mode){partyStart(stage,'party-wall',mode,'',o=>wallGame(stage,mode,o))}});
function wallGame(stage,mode,o){const bot=mode!=='pass',GOAL=2,S={turn:R(0,1),bars:[[[]],[[]]],done:[0,0],over:false,miss:[[],[]]};
  const used=b=>b.reduce((s,[n,d])=>s+n*12/d,0);
  stage.innerHTML=`<div class="fwall"><details class="fwhelp"><summary>📐 Show the fraction wall</summary>${fwWall()}</details>
    <div class="fwplayers">${[0,1].map(p=>`<div class="fwp" id="fwP${p}" style="--pc:${p?'var(--violet)':'var(--teal)'}"><div class="row"><b>${esc(o.names[p])}</b><span class="pill" id="fwD${p}">0 of ${GOAL} bars</span></div><div class="fwbar" id="fwB${p}"></div></div>`).join('')}</div>
    <div class="fwturn" id="fwT"></div></div>`;
  const cols=['#ffd27a','#ffb3c7','#bcd3fb','#bfe8cf','#d9c6ff','#f3c28b','#c6f0f0'];
  const draw=()=>{[0,1].forEach(p=>{const b=S.bars[p][S.bars[p].length-1];$('fwB'+p).innerHTML=`<div class="fwtrack">${b.map(([n,d],i)=>`<span class="fwbrick" style="flex:${n*12/d};background:${cols[(d+n)%cols.length]}">${fr(n,d)}</span>`).join('')}${used(b)<12?`<span class="fwgap" style="flex:${12-used(b)}"></span>`:''}</div><div class="fwticks">${Array.from({length:12},()=>'<i></i>').join('')}</div>`;
    $('fwD'+p).textContent=`${S.done[p]} of ${GOAL} bars`;$('fwP'+p).classList.toggle('now',S.turn===p&&!S.over)})};
  const qFor=(b,[n,d])=>{const before=used(b),after=before+n*12/d,right=frq(after,12),opts=[];
    if(b.length){const last=b.reduce((acc,x)=>radd(acc,x),[0,1]);const tt=frq(last[0]+n,last[1]+d);opts.push({v:tt,why:`You added the tops and the bottoms (${last[0]}+${n})/(${last[1]}+${d}). Use the wall: change both to twelfths, ${fr(before,12)} + ${fr(n*12/d,12)}.`});
      opts.push({v:frq(last[0]+n,Math.max(last[1],d)),why:`You added the tops but kept one bottom number. The pieces are different sizes, so change both to twelfths first.`})}
    else{if(d!==n*12/d&&d<12)opts.push({v:frq(d,12),why:`${fr(n,d)} is ${fr(n*12/d,12)}, not ${fr(d,12)}. A bigger bottom number means <b>smaller</b> pieces: ${d} of them make the whole bar.`});opts.push({v:frq(12-n*12/d||1,12),why:'That is how much is <b>left</b>, not how much is filled.'})}
    opts.push({v:frq(after+1,12),why:`Count the twelfths carefully: ${fr(before,12)} + ${fr(n*12/d,12)} = ${fr(after,12)}.`});
    const clean=opts.filter((x,i,a)=>x.v[0]*right[1]!==right[0]*x.v[1]&&a.findIndex(y=>y.v[0]*x.v[1]===x.v[0]*y.v[1])===i).slice(0,2);
    return {right,opts:shuffle([{v:right,ok:1},...clean]),before,after}};
  const turn=()=>{if(S.over)return;draw();const p=S.turn,b=S.bars[p][S.bars[p].length-1],left=12-used(b),cards=[pick(FW),pick(FW)];const isBot=bot&&p===1;
    $('fwT').innerHTML=`<div class="fwtc" style="--pc:${p?'var(--violet)':'var(--teal)'}"><h3>${isBot?'🤖 Robo’s turn':esc(o.names[p])+'’s turn'}</h3><p class="qs">Space left on the bar: <b>${fr(left,12)}</b>${frq(left,12)[1]!==12?` = ${rshow(frq(left,12))}`:''}. Pick a brick that fits.</p>
      <div class="row fwcards">${cards.map((c,i)=>`<button class="btn fwcard" data-i="${i}" ${isBot?'disabled':''}>${fr(c[0],c[1])}</button>`).join('')}<button class="btn" id="fwPass" ${isBot?'disabled':''}>Neither fits: pass</button></div><div id="fwM"></div></div>`;
    let tries=0;
    const choose=i=>{const c=cards[i],sz=c[0]*12/c[1];
      if(sz>left){tries++;sfx.no();$('fwM').innerHTML=`<p class="retrymsg">🔁 ${fr(c[0],c[1])} = ${fr(sz,12)}, but only ${fr(left,12)} is left. It will not fit!${c[1]>4&&sz>left?` (A bigger bottom number means <b>smaller</b> pieces, but ${c[0]} of them is still too many.)`:''}</p>`;if(tries>=2){S.miss[p].push(`${fr(c[0],c[1])} does not fit in ${fr(left,12)}`);return endTurn()}return}
      ask(c)};
    const ask=c=>{const Q=qFor(b,c);$('fwT').querySelector('.fwcards').innerHTML=`<span class="fwchosen">${fr(c[0],c[1])}</span><b>How much of the bar will be filled?</b>${Q.opts.map((x,i)=>`<button class="btn fwans" data-i="${i}" ${isBot?'disabled':''}>${rshow(x.v)}</button>`).join('')}`;$('fwM').innerHTML='';
      const pickA=(i)=>{const x=Q.opts[i],btn=$('fwT').querySelectorAll('.fwans')[i];if(x.ok){btn.classList.add('ok');sfx.ok();b.push(c);if(used(b)===12){S.done[p]++;confetti(50);$('fwM').innerHTML=`<p class="asknote">🎉 Bar complete! ${b.map(y=>fr(y[0],y[1])).join(' + ')} = 1 whole.</p>`;if(S.done[p]>=GOAL){draw();return PT.timer(()=>end(p),900)}S.bars[p].push([])}
          else $('fwM').innerHTML=`<p class="asknote">✅ ${fr(Q.before,12)} + ${fr(Q.after-Q.before,12)} = ${fr(Q.after,12)}${frq(Q.after,12)[1]!==12?` = ${rshow(Q.right)}`:''}</p>`;draw();return PT.timer(endTurn,isBot?1400:1500)}
        btn.classList.add('no');sfx.no();S.miss[p].push(x.why);$('fwM').innerHTML=`<p class="retrymsg">❌ ${x.why} The brick bounces off this turn.</p>`;PT.timer(endTurn,isBot?2200:3400)};
      if(isBot){const acc=BOT[o.bot].acc;PT.timer(()=>{const bad=Q.opts.findIndex(x=>!x.ok);pickA(Math.random()<acc||bad<0?Q.opts.findIndex(x=>x.ok):bad)},1300)}
      else $('fwT').querySelectorAll('.fwans').forEach((bt,i)=>bt.onclick=()=>{if($('fwT').querySelector('.fwans.ok,.fwans.no'))return;pickA(i)})};
    const pass=()=>{const fits=cards.some(c=>c[0]*12/c[1]<=left);if(fits&&!isBot){sfx.no();$('fwM').innerHTML=`<p class="retrymsg">🔁 One of these bricks does fit! Change each one to twelfths and compare with ${fr(left,12)}.</p>`;return}sfx.tap();endTurn()};
    if(isBot){const fit=cards.map((c,i)=>[c[0]*12/c[1],i]).filter(([s])=>s<=left).sort((a,b)=>b[0]-a[0]);PT.timer(()=>{if(!fit.length){$('fwM').innerHTML='<p class="asknote">🤖 Neither fits. Robo passes.</p>';return PT.timer(endTurn,1200)}
      $('fwT').querySelectorAll('.fwcard')[fit[0][1]].classList.add('ok');PT.timer(()=>ask(cards[fit[0][1]]),600)},1100)}
    else{$('fwT').querySelectorAll('.fwcard').forEach(bt=>bt.onclick=()=>choose(+bt.dataset.i));$('fwPass').onclick=pass}
    fitView()};
  const endTurn=()=>{if(S.over)return;S.turn=1-S.turn;turn()};
  const end=p=>{S.over=true;draw();const lines=[`${esc(o.names[0])}: ${S.done[0]} bars · ${esc(o.names[1])}: ${S.done[1]} bars`];
    [0,1].forEach(q=>{if(S.miss[q].length&&!(bot&&q===1))lines.push(`<b>${esc(o.names[q])}, things to remember:</b><br>${uniq(S.miss[q]).slice(0,4).join('<br>')}`)});
    if(p===0&&mode!=='pass')setBest('party-wall',S.miss[0].length===0?3:S.miss[0].length<3?2:1);
    if(p===0&&mode!=='pass')setTimeout(()=>arcReport('party-wall',Math.max(10,100-10*S.miss[0].length),{mode}),80);partyEnd(stage,mode==='pass'?`${esc(o.names[p])} wins!`:p===0?'You win! 🏆':'🤖 Robo wins this time!',lines,()=>wallGame(stage,mode,o))};
  turn()}

const HOWTO={
'p4-rounding':{steps:['A rocket hovers over a number line with its number on top, e.g. <b>27,104</b>. The digit that decides the rounding is in red.','<b>Step 1:</b> tap the two landing pads the rocket is between, e.g. 27,100 and 27,110.','<b>Step 2:</b> land the rocket on the <b>nearer</b> pad. If the red digit is 5 or more, go to the bigger pad. If it is 4 or less, go to the smaller pad.','You round to the nearest 10 first, then 100, then 1000.'],eg:'27,104 to the nearest 10 → the ones digit is 4, so land on 27,100.'},

'p4-nets':{steps:['You see a flat net, made of shapes joined together.','Imagine folding it up along the lines.','Answer the question: which solid does it make, or is it a net of a cube?','After you answer, watch the net fold up in 3D to check!'],eg:'6 squares in a cross shape fold into a cube.'},
'p4-graphs':{steps:['Look at the line graph or pie chart and read its title.','Read the scale on the side carefully: what does each line stand for?','Tap the point the question asks about, or choose or type the answer.','Use 🔍 Zoom to make the graph bigger if you need to.'],eg:'"Highest temperature" → tap the highest point on the line.'},
'p5-order':{steps:['You see a calculation, e.g. 8 + 12 ÷ (5 − 2).','Tap the operation sign you would do <b>first</b>. Then the next one, and the next.','The rule: brackets first, then × and ÷ (left to right), then + and − (left to right).','Then type the final answer.'],eg:'8 + 12 ÷ (5 − 2) → (5 − 2) = 3, then 12 ÷ 3 = 4, then 8 + 4 = 12.'},
'p5-slide':{steps:['A number sits in a place-value chart.','The question asks you to × or ÷ by 10, 100 or 1000, or to change units.','Slide the digits left (to multiply) or right (to divide): 1 place for 10, 2 places for 100, 3 places for 1000.','Press <b>Done</b> to check, or <b>Reset</b> to start again.'],eg:'3.6 × 100 → slide 2 places left → 360.'},
'p5-share':{steps:['Some pizzas are shared equally among some children.','<b>Step 1:</b> choose how many equal slices to cut each pizza into.','<b>Step 2:</b> each colour shows one child’s share. Work out how much pizza each child gets, as a fraction.','Remember: a ÷ b = a/b. For example, 3 pizzas ÷ 4 children = ¾ pizza each.'],eg:'2 pizzas shared by 3 children → each gets ⅔ of a pizza.'},
'p5-fgrid':{steps:['A square grid shows one whole.','<b>Step 1:</b> tap columns to shade the first fraction.','<b>Step 2:</b> tap rows to take a fraction of that shaded part.','The squares shaded twice are the answer. Count them over the total squares.'],eg:'⅔ of ¾: shade 3 of 4 columns, then 2 of 3 rows → 6/12 = ½.'},
'p5-rate':{steps:['Read the question about a rate, e.g. a tap fills 12 litres in 3 minutes.','<b>Step 1:</b> find the rate for 1 unit (for 1 minute, 1 kg, 1 hour…).','<b>Step 2:</b> use that rate to answer the question.','Some rounds have step charges like car parks: "every extra 30 minutes or part of it".'],eg:'12 litres in 3 min → 4 litres per minute → 7 min fills 28 litres.'},
'p5-tarea':{steps:['A triangle is drawn with its base marked in red.','<b>Step 1:</b> tap the line that is the <b>height</b>. The height meets the base (or the base line extended) at a right angle.','<b>Step 2:</b> work out the area: ½ × base × height.'],eg:'Base 10 cm, height 6 cm → ½ × 10 × 6 = 30 cm².'},
'p5-volume':{steps:['Each small cube is 1 cm by 1 cm by 1 cm (1 cm³).','Count the cubes in a solid, build a cuboid with a given volume, or find a missing length.','Volume of a cuboid = length × breadth × height.','In tank rounds, 1000 cm³ = 1 litre.'],eg:'A 4 cm × 3 cm × 2 cm cuboid has 24 cm³.'},
'p5-angles':{steps:['Look at the figure and find the angle marked <b>x</b>.','<b>Step 1:</b> choose the angle fact you need, e.g. "angles on a straight line add up to 180°".','<b>Step 2:</b> work out x and type it.'],eg:'x and 130° on a straight line → x = 180° − 130° = 50°.'},
'p5-triangles':{steps:['Some rounds: tap the right name for the triangle (equilateral, isosceles, scalene, right-angled…).','Equal tick marks on sides mean those sides are the same length.','Other rounds: find the unknown angle.','The angles in a triangle add up to 180°.'],eg:'Two equal sides → isosceles, so the two base angles are equal too.'},
'p5-quads':{steps:['<b>Who am I?</b> Clues about a mystery 4-sided shape appear one at a time.','Guess the shape as soon as you are sure, or press <b>Show another clue</b>. Guessing after fewer clues gives more points.','Other rounds: find an unknown angle in a parallelogram, rhombus or trapezium.','The angles in a quadrilateral add up to 360°.'],eg:'"4 equal sides, angles not 90°" → rhombus.'},
'p6-fdiv':{steps:['Read the question, e.g. ¾ of a cake shared among 3 people, or 2 ÷ ⅓.','Use the bar model: tap <b>Scoop!</b> to take out one share at a time until the amount runs out.','Count how many scoops (or how big each share is).','Type your answer as a fraction or whole number.'],eg:'2 ÷ ⅓ → 2 wholes hold 6 thirds → 6.'},
'p6-pchange':{steps:['Read the question about a percentage increase or decrease.','<b>Step 1:</b> move the slider to set the bar model, e.g. "after" is 80% of "before".','<b>Step 2:</b> work out the answer and type it.','Always compare with the <b>original</b> (before) amount.'],eg:'$50 decreased by 20% → 80% of $50 = $40.'},
'p6-ratio':{steps:['You help Chef Qubi in the kitchen.','Simplify ratios of cups, scale recipes up, pour drinks into a jug, and share baking into boxes.','Use a unit model: total units = add the ratio parts, then find 1 unit.','Order matters: "A to B" means A comes first.'],eg:'Share 20 cookies in the ratio 2 : 3 → 5 units → 1 unit = 4 → 8 and 12.'},
'p6-algebra':{steps:['Some rounds: simplify an expression like 5k + 3 − 2k.','Some rounds: find the value of an expression when the letter is a number.','Balance rounds: take the same amount off both sides of the scale to find x.','Then type your answer.'],eg:'3x + 4 = 19 → take 4 off both sides → 3x = 15 → x = 5.'},
'p6-circle':{steps:['Look at the figure made from circles, semicircles or quarter circles.','For perimeter: <b>Step 1</b> tap every edge around the outside, then press Done. For area: <b>Step 1</b> choose the formula.','<b>Step 2:</b> calculate. Use the value of π the question gives (3.14 or 22/7).','Circumference = π × diameter. Area = π × radius × radius.'],eg:'Semicircle, diameter 14 cm: curved edge = ½ × 22/7 × 14 = 22 cm, plus 14 cm straight → 36 cm.'},
'p6-cuberoot':{steps:['A cube-shaped crate is locked. You know its volume, e.g. 343 cm³.','Find the length of one edge: which number × itself × itself gives the volume?','Type an edge length and press Try. You get 4 tries, and the crate tells you if your guess is too small or too big.','Some rounds use square roots and areas instead.'],eg:'343 = 7 × 7 × 7, so the edge is 7 cm.'},
'p6-chain':{steps:['The figure is made of squares, rectangles, rhombuses or parallelograms joined to triangles.','First find angle <b>y</b>, then use it to find angle <b>x</b>.','Look for equal sides (isosceles triangles), parallel lines and straight lines (180°).','Type each answer. The figure is not drawn to scale, so do not measure it.'],eg:'In a rhombus the opposite angles are equal, and the angles next to each other add up to 180°.'},
'p6-average':{steps:['Towers of blocks show how many each child has.','Tap a tower to pick up its top block, then tap another tower to drop it there.','Move blocks until all the towers are the same height. That height is the <b>average</b>.','Other rounds: average = total ÷ number of items, and total = average × number of items.'],eg:'Towers of 2, 5 and 5 → total 12 → 12 ÷ 3 = 4 each.'},
'p4-diner':{steps:['Read the order ticket. Each order uses decimals.','For adding and subtracting, first choose the layout with the <b>decimal points lined up</b> (not the last digits).','Fill empty places with 0 (3.5 → 3.50, 5 → 5.00), then work out the answer and press Check.','For × and ÷, think in tenths or hundredths first (0.4 = 4 tenths), then change back.','Wrong the first time? Qubi tells you what went wrong so you can fix it.'],eg:'3.5 + 1.25 → 3.50 + 1.25 = 4.75 (not 1.60).'},
'p4-train':{steps:['Read the departure board.','24-hour clock: a.m. keeps the hour, p.m. adds 12 (7.45 p.m. → 19 45). Type 4 digits.','For journeys, count on: to the next hour, then whole hours, then the minutes left. Type the hours and minutes.','Remember: <b>1 hour = 60 minutes</b>, not 100.'],eg:'09 45 → 10 20: 15 min to 10 00, then 20 min → 35 min.'},
'p4-compass':{steps:['North is at the top unless the North arrow points another way. Always check the arrow first!','Tap a direction on the compass buttons (N, NE, E, SE, S, SW, W, NW).','Turns: clockwise ↻ is the way clock hands move. Each step between the 8 points is 45°, a ¼ turn is 90°.','On walking rounds, tap the square where you end up. Count jumps, not the square you start on.'],eg:'Face N, turn 90° clockwise → you face E.'},
'p5-pizza':{steps:['Look at the pizzas and read the order.','<b>Step 1:</b> choose the smallest common denominator (a number both bottom numbers go into).','<b>Step 2:</b> type the answer as a mixed number: whole number in the big box, the fraction in the small boxes.','Never add the bottom numbers. When subtracting and the first fraction is smaller, rename 1 whole.'],eg:'1 ½ + ⅔ → 1 3/6 + 4/6 = 1 7/6 = 2 1/6.'},
'p5-pshop':{steps:['Each round is a shop problem with percentages.','Percent means "out of 100". p% of a number = p/100 × the number.','Some rounds have two steps, e.g. find the discount first, then the price you pay.','GST in Singapore is 9%, and it is <b>added</b> to the price. A discount is <b>taken away</b>.'],eg:'20% off $60: discount = $12, you pay $48.'},
'p6-pie':{steps:['Read the bakery’s pie chart and the question.','The whole pie is <b>100%</b> or <b>360°</b>. A right angle mark means 90° = ¼.','Use the fraction or percentage of the whole to find the number of items.','If you know a part, work back to the whole (e.g. 30% → 45, so 100% → 150).'],eg:'72° of 250 items: 72/360 = 1/5, so 1/5 × 250 = 50.'},
'party-tug':{steps:['Two players share one screen: one on each side. (Or play against Robo.)','A question appears on each side. Tap the right answer as fast as you can.','Every right answer pulls the knot one step towards you. A wrong answer freezes your side for a moment and shows you the right fact.','Pull the knot 6 steps to your side to win, or be ahead when the 90 seconds run out.'],eg:'7 × 8 → tap 56. If you tap 54, Qubi reminds you that 54 is 6 × 9.'},
'party-bingo':{steps:['You have a 4 × 4 bingo card of numbers.','A clue is called, e.g. "3 + 4 × 5". Work it out and tap the answer on your card.','If the answer is not on your card, tap <b>Not on my card</b>.','Get four in a row (across, down or diagonal) to win. <b>Whole class:</b> project the screen; pupils draw a 4 × 4 grid and fill it with 16 numbers from the list.'],eg:'3 + 4 × 5 = 23 (multiply first), not 35.'},
'party-wall':{steps:['Each player has an empty bar worth 1 whole, split into twelfths.','On your turn you get two fraction bricks. Pick one that fits in the space left, or pass if neither fits.','Then say how much of the bar will be filled. Right: the brick goes on. Wrong: it bounces off.','Fill exactly 2 whole bars first to win. Open the fraction wall if you need help.'],eg:'⅓ + ¼ = 4/12 + 3/12 = 7/12 (not 2/7).'},
};
/* ================= LEADERBOARD + USAGE LOG =================
   Works only when backend.js (GitHub Pages version) has connected to Firebase and set window.ARCB.
   Without it (e.g. the Claude artifact), none of this shows and the games work exactly as before. */
const SID=Math.random().toString(36).slice(2,10);
function arcMe(){try{return JSON.parse(localStorage.getItem('arcMe')||'null')}catch(e){return null}}
function arcSetMe(m){try{localStorage.setItem('arcMe',JSON.stringify(m))}catch(e){}}
const BADNICK=/(fuck|shit|bitch|cunt|dick|pussy|sex|porn|nigg|fag|idiot|stupid|bodoh|knn|ccb|lanjiao|chibai|pukimak)/i;
function arcLog(event,game,score){if(!window.ARCB)return;const me=arcMe();
  window.ARCB.log({event,game:game||'',score:score==null?-1:Math.max(0,Math.min(1000,Math.round(score))),nick:me?me.nick:'',cls:me?me.cls:'',sid:SID,device:innerWidth<600?'phone':innerWidth<1000?'tablet':'computer'}).catch(()=>{})}
async function arcReport(id,score,o={}){if(!window.ARCB)return;const me=arcMe();if(!o.again)arcLog('finish',id,score);
  if(!me||!me.nick){lbNote('<button class="btn" id="lbJoin">🏆 Add my name to the leaderboard</button>',()=>$('lbJoin').onclick=()=>playerPrompt(()=>arcReport(id,score,{...o,again:1})));return}
  const G=GAMES[id];
  try{await window.ARCB.post({game:id,title:G.title,level:G.level,nick:me.nick,cls:me.cls||'',score:Math.max(0,Math.min(1000,Math.round(score))),stars:o.stars==null?-1:o.stars,mode:o.mode||'solo'});
    const rows=bestPer(await window.ARCB.top(id));const k=rows.findIndex(r=>r.nick===me.nick&&r.cls===(me.cls||''));
    lbNote(`🏆 Score saved to the leaderboard${k>=0?` · you are <b>#${k+1}</b> of ${rows.length} for ${esc(G.title)}`:''}. <a href="#leaderboard/${id}">See the leaderboard →</a>`)}
  catch(e){lbNote('Could not reach the leaderboard just now. Your game still counts on this device.')}}
function lbNote(html,wire){const end=document.querySelector('#gStage .end, #vmOver .end, .ptover .end, .rqrep');if(!end)return;let n=end.querySelector('.lbnote');if(!n){n=document.createElement('p');n.className='lbnote';end.appendChild(n)}n.innerHTML=html;if(wire)wire()}
/* keep each player's best score only, highest first */
function bestPer(rows){const m=new Map();rows.forEach(r=>{const k=r.nick+'|'+(r.cls||'');if(!m.has(k)||m.get(k).score<r.score||(m.get(k).score===r.score&&r.t<m.get(k).t))m.set(k,r)});return [...m.values()].sort((a,b)=>b.score-a.score||a.t-b.t)}
function playerPrompt(after){const old=arcMe()||{nick:'',cls:''};const o=document.createElement('div');o.className='zoomov lbmodal';
  o.innerHTML=`<div class="end"><span class="tag">Who's playing?</span><h3>Pick a nickname</h3><p style="margin:0">Use a nickname, <b>not your full name</b>. It shows on the leaderboard.</p>
    <label class="row"><b>Nickname</b><input class="num" id="lbNick" maxlength="14" style="width:10em" value="${esc(old.nick)}" placeholder="e.g. Speedy Sam"></label>
    <label class="row"><b>Class</b><input class="num" id="lbCls" maxlength="8" style="width:6em" value="${esc(old.cls)}" placeholder="e.g. 5B"></label><p id="lbErr" class="askneed"></p>
    <div class="row"><button class="btn primary" id="lbOk">Save</button><button class="btn" id="lbGuest">Play as guest</button></div></div>`;
  document.body.appendChild(o);$('lbNick').focus();
  const close=()=>{o.remove();if(location.hash===''||location.hash==='#')hub()};
  $('lbGuest').onclick=()=>{arcSetMe({nick:'',cls:'',guest:1});close()};
  $('lbOk').onclick=()=>{const nick=$('lbNick').value.trim().replace(/\s+/g,' '),cls=$('lbCls').value.trim().toUpperCase().replace(/\s+/g,'');
    if(nick.length<2)return $('lbErr').textContent='Type a nickname with at least 2 letters.';if(BADNICK.test(nick))return $('lbErr').textContent='Please choose a kinder nickname.';
    arcSetMe({nick,cls});arcLog('join');sfx.ok();close();if(after)after()}}
function hubPlayerBar(){if(!window.ARCB)return '';const me=arcMe();
  return `<div class="row lbbar">${me&&me.nick?`<span class="pill">👤 ${esc(me.nick)}${me.cls?' · '+esc(me.cls):''}</span>`:'<span class="pill">👤 Guest</span>'}<button class="btn" id="lbWho">${me&&me.nick?'Change':'Add my name'}</button><a class="btn primary" href="#leaderboard" style="text-decoration:none;display:inline-flex;align-items:center">🏆 Leaderboard</a></div>`}
function wireHubPlayer(){const b=$('lbWho');if(b)b.onclick=()=>playerPrompt()}
async function boardView(gid){const ids=ORDER.filter(id=>id!=='p6-quest'||true);if(!gid||!GAMES[gid])gid=ids.find(id=>GAMES[id].level===level)||ids[0];
  const me=arcMe()||{};let span='all',cls='';
  $('view').innerHTML=`<div style="display:grid;gap:14px"><div class="gbar"><a class="back" href="#">← All games</a></div><h2 style="margin:0;font:700 2rem var(--display)">🏆 Leaderboard</h2>
    <div class="row"><select id="lbG" class="num" style="width:auto">${['P4','P5','P6','All levels'].map(l=>`<optgroup label="${l}">${ids.filter(id=>GAMES[id].level===l).map(id=>`<option value="${id}" ${id===gid?'selected':''}>${esc(GAMES[id].title)}</option>`).join('')}</optgroup>`).join('')}</select>
    <select id="lbC" class="num" style="width:auto"><option value="">All classes</option>${me.cls?`<option value="${esc(me.cls)}">Only ${esc(me.cls)}</option>`:''}</select></div><div id="lbList" class="lblist"><p>Loading…</p></div><p class="qs">Each player's best score is shown.</p></div>`;
  let rows=[];
  const draw=()=>{const now=Date.now(),cut=span==='today'?new Date().setHours(0,0,0,0):span==='week'?now-7*864e5:0;
    const r=bestPer(rows.filter(x=>x.t>=cut&&(!cls||x.cls===cls))).slice(0,30);
    $('lbList').innerHTML=r.length?`<ol class="lbrows">${r.map((x,i)=>`<li class="${x.nick===me.nick&&x.cls===(me.cls||'')?'me':''}"><span class="lbr">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><b>${esc(x.nick)}</b><span class="lbc">${esc(x.cls||'')}</span><span class="lbs">${x.score}${x.stars>=0?` <small>${'★'.repeat(x.stars)}</small>`:''}</span></li>`).join('')}</ol>`:'<p>No scores yet. Be the first!</p>'};
  const load=async()=>{$('lbList').innerHTML='<p>Loading…</p>';try{rows=await window.ARCB.top(gid);draw()}catch(e){$('lbList').innerHTML='<p>Could not load the leaderboard. Check your internet connection.</p>'}};
  $('lbG').onchange=()=>{gid=$('lbG').value;history.replaceState(null,'','#leaderboard/'+gid);load()};$('lbC').onchange=()=>{cls=$('lbC').value;draw()};
  if(!window.ARCB){$('lbList').innerHTML='<p>The leaderboard is only available on the class website.</p>';return}load()}
addEventListener('arcb-ready',()=>{const h=location.hash.slice(1);if(!h||h==='')hub();else if(h.startsWith('leaderboard'))boardView(h.split('/')[1]);arcLog('open');
  const me=arcMe();if(!me&&(!h||h===''))setTimeout(()=>{if(!arcMe())playerPrompt()},400)});
/* ================= PSLE QUEST: question bank =================
   Modelled on the 2026 P6 prelim papers: Paper 1 Booklet A (MCQ, no calculator),
   Paper 1 Booklet B (short answer, no calculator), Paper 2 (short + long answer, calculator allowed).
   Each generator returns {stem, fig, parts:[...], work:[...]} with fresh numbers every time. */
const RQB=[];const rq=o=>RQB.push(o);
const RQT={whole:'Whole numbers',frac:'Fractions',dec:'Decimals',pct:'Percentage',ratio:'Ratio',rate:'Rate',alg:'Algebra',avg:'Average',meas:'Time, money and units',angle:'Angles and figures',area:'Area and perimeter',circ:'Circles',vol:'Volume',solid:'Solids and nets',pat:'Patterns',data:'Graphs and charts'};
const r6=x=>Math.round(x*1e6)/1e6;
function fmtN(x){x=r6(x);const neg=x<0;x=Math.abs(x);let [i,d]=String(x).split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,',');return (neg?'−':'')+i+(d?'.'+d:'')}
const $m=x=>{x=r6(x);if(Number.isInteger(x))return '$'+fmtN(x);const [i,d]=x.toFixed(2).split('.');return '$'+fmtN(+i)+'.'+d};
const vi=v=>`<i>${v}</i>`;
const lin=(c,v,k)=>{let s=c===0?'':(c===1?'':c===-1?'−':c)+vi(v);if(k)s+=s?(k>0?` + ${k}`:` − ${-k}`):String(k);return s||'0'};
const Qn=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(Math.abs(n),d)||1;return [n/g,d/g]};
const Qadd=(a,b)=>Qn(a[0]*b[1]+b[0]*a[1],a[1]*b[1]),Qsub=(a,b)=>Qn(a[0]*b[1]-b[0]*a[1],a[1]*b[1]),Qmul=(a,b)=>Qn(a[0]*b[0],a[1]*b[1]),Qdiv=(a,b)=>Qn(a[0]*b[1],a[1]*b[0]);
const Qh=q=>q[1]===1?String(q[0]):nice(q[0],q[1]),Qv=q=>q[0]/q[1];
const Qf=q=>q[1]===1?String(q[0]):fr(q[0],q[1]); // proper/improper, no mixed
/* MCQ options: answer + distractors, deduped; numbers sorted ascending like the papers */
function mc(a,ds,f=String,keep){const seen=new Set([f(a)]),o=[a];
  for(const d of ds){if(d===undefined||d===null||(typeof d==='number'&&(!isFinite(d)||d<=0)))continue;const s=f(d);if(seen.has(s))continue;seen.add(s);o.push(d);if(o.length===4)break}
  let k=1;while(o.length<4&&typeof a==='number'&&k<60){const d=r6(a+Math.ceil(k/2)*(k%2?1:-1)*Math.max(1,Math.round(Math.abs(a)*.1)));k++;const s=f(d);if(d>0&&!seen.has(s)){seen.add(s);o.push(d)}}
  const opts=typeof a==='number'&&!keep?o.slice().sort((x,y)=>x-y):shuffle(o);return {type:'choice',opts:opts.map(f),ans:opts.indexOf(a)}}
const num=(v,o={})=>Object.assign({type:'num',v,marks:1},o);
const RQPV=['ones','tens','hundreds','thousands','ten thousands','hundred thousands'];
const tm=m=>{const h=Math.floor(m/60),mm=m%60;return (h?`${h} h`:'')+(h&&mm?' ':'')+(mm||!h?`${mm} min`:'')};
const clock=m=>{m=((m%1440)+1440)%1440;let h=Math.floor(m/60);const mm=m%60,ap=h<12?'a.m.':'p.m.';h=h%12||12;return `${h}.${String(mm).padStart(2,'0')} ${ap}`};

/* ---------- SVG helpers ---------- */
const svgW=(w,h,inner,mw)=>`<svg class="gsvg rqf" viewBox="0 0 ${w} ${h}" style="max-width:${mw||w}px" role="img">${inner}</svg>`;
const tx=(x,y,s,a='middle',c='')=>`<text x="${r6(x)}" y="${r6(y)}" text-anchor="${a}" ${c?`class="${c}"`:''}>${s}</text>`;
const ln=(a,b,c='')=>`<line x1="${r6(a[0])}" y1="${r6(a[1])}" x2="${r6(b[0])}" y2="${r6(b[1])}" ${c?`class="${c}"`:''}/>`;
const PG=(pts,c='')=>`<polygon points="${pts.map(p=>r6(p[0])+','+r6(p[1])).join(' ')}" ${c?`class="${c}"`:''}/>`;
const deg=Math.PI/180;
/* angle arc at vertex v between directions to a and b, with label */
function angArc(v,a,b,label,r=22){const a1=Math.atan2(a[1]-v[1],a[0]-v[0]),a2=Math.atan2(b[1]-v[1],b[0]-v[0]);let d=a2-a1;while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;
  const p1=[v[0]+r*Math.cos(a1),v[1]+r*Math.sin(a1)],p2=[v[0]+r*Math.cos(a1+d),v[1]+r*Math.sin(a1+d)],m=a1+d/2,lr=r+15;
  return `<path class="arc" d="M${r6(p1[0])} ${r6(p1[1])} A${r} ${r} 0 0 ${d>0?1:0} ${r6(p2[0])} ${r6(p2[1])}"/>`+(label?tx(v[0]+lr*Math.cos(m),v[1]+lr*Math.sin(m)+4,label,'middle','ang'):'')}
const tk=(a,b)=>{const m=[(a[0]+b[0])/2,(a[1]+b[1])/2],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy),nx=-dy/l*6,ny=dx/l*6;return ln([m[0]-nx,m[1]-ny],[m[0]+nx,m[1]+ny],'thin')};
const lab=(p,s,dx=0,dy=0)=>tx(p[0]+dx,p[1]+dy,s,'middle','ptl');
function barChart(cats,vals,max,step,minor,ylab,hide){const W=460,H=250,x0=70,y0=20,y1=205,x1=W-12,bw=(x1-x0)/cats.length;let s='';

function rqPool(kind){return RQB.filter(g=>kind==='mcq1'?g.kind==='mcq1':kind==='mcq2'?g.kind==='mcq2':kind==='saq1'?g.kind==='saq'&&g.paper===1:kind==='saq2'?g.kind==='saq':g.kind==='long')}

function rqTiers(n,w){let c=Math.round(n*w[2]),a=Math.round(n*w[0]);if(w[2]>0&&n>=4&&c===0)c=1;if(a+c>n)a=n-c;const out=[];for(let i=0;i<n;i++)out.push(i<a?1:i<n-c?2:3);return out}
function rqPool(kind){return RQB.filter(g=>kind==='mcq1'?g.kind==='mcq1':kind==='mcq2'?g.kind==='mcq2':kind==='saq1'?g.kind==='saq'&&g.paper===1:kind==='saq2'?g.kind==='saq':g.kind==='long')}
function rqBuild(qk,topic){const list=[],used=new Set(),tUse={},w=RQMIX[RQMIXK].w;
  if(qk==='topic'){const tg=RQB.filter(g=>g.topic===topic),grab=(f,n,st)=>{const pool=shuffle(tg.filter(f));for(let i=0;i<n&&pool.length;i++)list.push({gen:pool[i%pool.length],st})};
    grab(g=>g.kind==='mcq1'||g.kind==='mcq2',3,'A');grab(g=>g.kind==='saq'&&g.paper===1,2,'B');grab(g=>(g.kind==='saq'&&g.paper===2)||g.kind==='long',3,'C');
    while(list.length<6){const g=pick(tg);list.push({gen:g,st:g.kind.startsWith('mcq')?'A':g.kind==='long'||g.paper===2?'C':'B'})}
    const ord={A:0,B:1,C:2};list.sort((a,b)=>ord[a.st]-ord[b.st]||(a.gen.kind==='long')-(b.gen.kind==='long')||a.gen.lv-b.gen.lv);return list}
  RQQUEST[qk].plan.forEach(([st,items])=>items.forEach(([k,n])=>{const tiers=k==='mcq1'?Array(n).fill(1):rqTiers(n,w);
    tiers.forEach(lv=>{const all=rqPool(k).filter(g=>!used.has(g.id));let pool=[];for(const d of [0,1,-1,2,-2]){pool=all.filter(g=>g.lv===lv+d);if(pool.length)break}
      pool=shuffle(pool);pool.sort((a,b)=>(tUse[a.topic]||0)-(tUse[b.topic]||0));const g=pool[0]||pick(rqPool(k));used.add(g.id);tUse[g.topic]=(tUse[g.topic]||0)+1;list.push({gen:g,st})})}));return list}

function rqGo(qk,topic){clearInterval(RQ&&RQ.iv);RQ={qk,topic,mix:RQMIXK,running:false,iv:0,last:0,list:rqBuild(qk,topic),i:0,got:0,max:0,byT:{},byS:{},streak:0,t0:Date.now(),res:[]};RQ.list.forEach(x=>{x.q=null;x.ms=0});rqStageIntro()}

const rqAim=it=>it.q?it.q.marks*RQPACE[it.st]:0,mmss=ms=>{const s=Math.round(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};

function rqStageIntro(){if(RQ)RQ.running=false;const it=RQ.list[RQ.i],S=RQSTAGE[it.st],stage=$('gStage'),n=RQ.list.filter(x=>x.st===it.st).length;rqCalcShow(false);
  stage.innerHTML=`${rqTrack()}<div class="rqintro s${it.st}"><span class="rqbig" aria-hidden="true">${S.icon}</span><span class="tag">Stage ${'ABC'.indexOf(it.st)+1}${RQ.qk==='boss'?'':' of 3'}</span><h3>${S.name}: ${S.sub}</h3><p>${S.how}</p>
    <p><span class="rqcalc-tag ${S.calc?'on':''}">${S.calc?'🧮 Calculator allowed in this stage':'🚫 No calculator in this stage'}</span> · ${n} question${n>1?'s':''}</p><button class="btn primary" id="rqStart">Start ${S.name} →</button></div>`;

function rqTrack(){return `<div class="rqtrack">${['A','B','C'].filter(s=>RQ.list.some(x=>x.st===s)).map(s=>`<div class="rqtr ${RQ.list[Math.min(RQ.i,RQ.list.length-1)].st===s?'cur':''}"><b>${RQSTAGE[s].icon} ${RQSTAGE[s].name}</b><span>${RQ.list.map((x,i)=>x.st===s?`<i class="d ${x.r===undefined?(i===RQ.i?'now':''):x.r>=1?'ok':x.r>0?'half':'no'}" title="Question ${i+1}"></i>`:'').join('')}</span></div>`).join('')}</div>`}

function rqShow(){document.body.classList.add('playing');requestAnimationFrame(()=>fitView());const it=RQ.list[RQ.i],S=RQSTAGE[it.st];let q=it.q;
  if(!q){for(let t=0;t<5&&!q;t++){try{q=it.gen.make()}catch(e){q=null}}it.q=q;q.parts.forEach(p=>{p.tries=0;p.got=null});q.marks=q.parts.reduce((a,p)=>a+p.marks,0)}

function rqPartHTML(p,j,n){const lb=n>1?`<b class="rqlb">(${'abcd'[j]})</b>`:'';const qq=p.q?`<div class="rqpq">${lb}<span>${p.q}</span><span class="rqmk">[${p.marks}]</span></div>`:'';
  let inp='';
  if(p.type==='choice')inp=`<div class="choices one rqch">${p.opts.map((o,k)=>`<button class="btn" data-k="${k}"><span class="rqon">(${k+1})</span> ${o}</button>`).join('')}</div>`;
  else if(p.type==='num'||p.type==='expr'||p.type==='set')inp=`<div class="row rqin">${n>1||p.q?'':''}<b>Ans:</b>${p.pre?`<span>${p.pre}</span>`:''}<input class="num" ${p.type==='num'?'inputmode="decimal"':''} autocomplete="off" aria-label="Answer ${n>1?'('+'abcd'[j]+')':''}" style="width:${p.type==='num'?'9em':'11em'}">${p.unit?`<span>${p.unit}</span>`:''}<button class="btn primary rqchk">Check</button></div>${p.type==='set'?'<small class="rqhint">Separate the numbers with commas, e.g. 1, 2, 4</small>':p.type==='expr'?'<small class="rqhint">Type it like 6k + 3</small>':p.simp?'<small class="rqhint">Fractions: type 3/4, or a mixed number like 1 2/3</small>':''}`;
  else if(p.type==='multi')inp=`<div class="row rqin"><b>Ans:</b>${p.v.map((_,k)=>`${p.labels?`<span>${p.labels[k]}:</span>`:''}<input class="num sm" inputmode="decimal" autocomplete="off" aria-label="${p.labels?p.labels[k]:p.units[k]}"><span>${p.units[k]}</span>`).join(' ')}<button class="btn primary rqchk">Check</button></div>`;
  else if(p.type==='tfn')inp=`<table class="rqt rqtfn"><tr><th>Statement</th><th>True</th><th>False</th><th>Not possible to tell</th></tr>${p.rows.map((r,k)=>`<tr><td>${r[0]}</td>${[0,1,2].map(c=>`<td><button class="tf" data-r="${k}" data-c="${c}" aria-label="${['True','False','Not possible to tell'][c]}" aria-pressed="false"></button></td>`).join('')}</tr>`).join('')}</table><div class="row"><button class="btn primary rqchk">Check</button></div>`;
  return `<div class="rqpart" id="rqP${j}" data-j="${j}">${qq}${p.q||n>1?'':''}<div class="rqarea">${inp}</div><div class="rqfb" aria-live="polite"></div></div>`}

function rqActivate(j){const q=RQ.list[RQ.i].q;RQ.part=j;q.parts.forEach((p,k)=>{const el=$('rqP'+k);el.classList.toggle('act',k===j);el.classList.toggle('wait',k>j);el.querySelectorAll('button,input').forEach(b=>{if(b.closest('.rqfb'))return;if(p.got!==null)return;b.disabled=k!==j||b.dataset.dead==='1'})});
  const el=$('rqP'+j);if(el){const i=el.querySelector('input');if(i&&!('ontouchstart' in window))i.focus({preventScroll:true});RQ.input=i||null;if(j>0)el.scrollIntoView({behavior:calm?'auto':'smooth',block:'nearest'})}}

function rqParse(s){s=String(s).trim().replace(/[$,°%]/g,'').replace(/\s*(cm²|cm³|cm|m²|m|kg|g|ℓ|l|ml|min|h|km)$/i,'').replace(/−/g,'-').trim();let m;
  if((m=s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/)))return {v:+m[1]+ +m[2]/+m[3],n:+m[1]*+m[3]+ +m[2],d:+m[3],fr:true};
  if((m=s.match(/^(-?\d+)\s*\/\s*(\d+)$/)))return +m[2]?{v:+m[1]/+m[2],n:+m[1],d:+m[2],fr:true}:null;
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s))return {v:+s};return null}
function rqExpr(s,x){s=s.replace(/\s|×|\*/g,'').replace(/−/g,'-').toLowerCase();if(!s)return null;let c=0,k=0;const terms=s.match(/[+-]?[^+-]+/g);if(!terms||terms.join('')!==s)return null;
  for(const t of terms){const m=t.match(/^([+-]?)(\d*\.?\d*)([a-z]?)$/);if(!m)return null;const sg=m[1]==='-'?-1:1;if(m[3]){if(m[3]!==x)return null;c+=sg*(m[2]===''?1:+m[2])}else{if(m[2]==='')return null;k+=sg*+m[2]}}return {c,k}}
function rqGrade(p,el){/* returns {ok,msg} or null if nothing entered */
  if(p.type==='num'){const r=rqParse(el.querySelector('input').value);if(!r)return null;const ok=Math.abs(r.v-p.v)<=(p.tol||1e-6);
    if(ok&&p.simp&&r.fr&&gcd(Math.abs(r.n),r.d)>1)return {ok:false,msg:'Right value, but give the fraction in its simplest form.'};
    if(ok&&p.simp&&r.fr&&Math.abs(r.n)>r.d&&false)return {ok:true};return {ok}}
  if(p.type==='expr'){const r=rqExpr(el.querySelector('input').value,p.v.x);if(!r)return el.querySelector('input').value.trim()?{ok:false,msg:`Write it using ${p.v.x}, like 4${p.v.x} + 7.`}:null;return {ok:r.c===p.v.c&&r.k===p.v.k}}
  if(p.type==='set'){const v=el.querySelector('input').value;if(!v.trim())return null;const a=[...new Set((v.match(/\d+/g)||[]).map(Number))].sort((x,y)=>x-y);return {ok:a.join()===p.v.slice().sort((x,y)=>x-y).join(),msg:a.length&&a.length<p.v.length?'Some common factors are missing.':''}}
  if(p.type==='multi'){const ins=[...el.querySelectorAll('input')],vs=ins.map(i=>rqParse(i.value));if(vs.some(v=>!v))return null;const oks=vs.map((v,k)=>Math.abs(v.v-p.v[k])<=(p.tol||1e-6));ins.forEach((i,k)=>{i.classList.toggle('okc',oks[k]);i.classList.toggle('noc',!oks[k])});return {ok:oks.every(Boolean)}}
  if(p.type==='tfn'){const pk=p.rows.map((_,k)=>{const b=el.querySelector(`.tf[data-r="${k}"][aria-pressed="true"]`);return b?+b.dataset.c:-1});if(pk.includes(-1))return {ok:false,msg:'Tick one box in every row first.',skip:true};
    const oks=pk.map((c,k)=>c===p.rows[k][1]);el.querySelectorAll('tr').forEach((tr,k)=>{if(k)tr.classList.toggle('bad',!oks[k-1])});return {ok:oks.every(Boolean),msg:oks.every(Boolean)?'':`${oks.filter(x=>!x).length} row${oks.filter(x=>!x).length>1?'s are':' is'} not right yet.`}}}
function rqShowAns(p){if(p.type==='choice')return `(${p.ans+1}) ${p.opts[p.ans]}`;if(p.type==='num')return (p.pre||'')+(p.show||fmtN(p.v))+(p.unit?(p.unit==='°'||p.unit==='%'?'':' ')+p.unit:'');if(p.type==='expr'||p.type==='set')return p.show;
  if(p.type==='multi')return p.v.map((v,k)=>(p.labels?p.labels[k]+' ':'')+fmtN(v)+' '+p.units[k]).join(', ');if(p.type==='tfn')return p.rows.map(r=>`${['True','False','Not possible to tell'][r[1]]}`).join(' · ')}

function rqWire(p,j){const el=$('rqP'+j);
  const submit=(res,btn)=>{if(!res)return;if(res.skip){el.querySelector('.rqfb').innerHTML=`<p class="rqmsg">${res.msg}</p>`;return}

    else if(p.tries===1){fb.innerHTML=`<p class="rqmsg no">✗ ${res.msg||'Not quite.'} Check your working and try once more (for half the marks).</p>`;sfx.no();qubi('gQ','oops',pick(RETRY));

    else{p.got=0;fb.innerHTML=`<p class="rqmsg no">✗ ${res.msg?res.msg+' ':''}The answer is <b>${rqShowAns(p)}</b>.</p>`;sfx.no();qubi('gQ','oops',pick(OOPS));if(btn)btn.classList.add('wrong');

    el.querySelector('.rqchk').onclick=()=>submit(rqGrade(p,el))}
  else{const go=()=>{if(p.got!==null)return;el.querySelectorAll('input').forEach(i=>i.classList.remove('okc','noc'));const r=rqGrade(p,el);if(!r){el.querySelector('.rqfb').innerHTML='<p class="rqmsg">Type your answer first.</p>';return}submit(r)};

function rqHit(n){const hp=$('rqHp');if(!hp)return;let k=n;const hs=[...hp.querySelectorAll('.h:not(.gone):not(.half)')],half=hp.querySelector('.h.half');

function rqDone(){rqClock(false);const it=RQ.list[RQ.i],q=it.q,got=q.parts.reduce((a,p)=>a+p.got,0),isBoss=it.gen.kind==='long';
  it.r=got/q.marks;RQ.got+=got;RQ.max+=q.marks;const t=it.gen.topic;RQ.byT[t]=RQ.byT[t]||[0,0];RQ.byT[t][0]+=got;RQ.byT[t][1]+=q.marks;RQ.byS[it.st]=RQ.byS[it.st]||[0,0];RQ.byS[it.st][0]+=got;RQ.byS[it.st][1]+=q.marks;

  let head='';if(isBoss){const m=$('rqBoss').querySelector('.rqmon');if(got===q.marks){rqKO(m,t);head=`<p class="fbt">💥 You defeated ${RQBOSS[t]||'the boss'}!</p>`;sfx.win();confetti(120,true);qubi('gQ','party','Boss down!',true)}
    else{m.classList.add('escape');head=`<p class="fbt">${RQBOSS[t]||'The boss'} escaped with ${fmtN(q.marks-got)} heart${q.marks-got===1?'':'s'} left. Study the working and get it next time!</p>`;qubi('gQ','oops','So close!')}}
  else head=`<p class="fbt">${got===q.marks?(perfect?'Full marks!':'Got there!'):got>0?'Some marks.':'No marks this time.'} ${fmtN(got)} / ${q.marks}</p>${RQ.streak>=3?`<p class="streak">🔥 Streak ×${RQ.streak}</p>`:''}`;
  if(!isBoss)qubi('gQ',got===q.marks?'cheer':'oops',got===q.marks?(RQ.streak>=3?`Streak ×${RQ.streak}!`:pick(CHEER)):pick(OOPS));

  const last=RQ.i+1>=RQ.list.length,nextSt=!last&&RQ.list[RQ.i+1].st!==it.st;
  $('gf').innerHTML=`<div class="fb ${got===q.marks?'ok':'no'}">${head}<p class="rqtline">⏱ You took <b>${mmss(it.ms)}</b> (aim about ${mmss(rqAim(it)*1000)}). ${it.ms<=rqAim(it)*1000?'Good pace.':it.ms<=rqAim(it)*1500?'A little slow. That is fine while you are learning.':'This took a while. In the exam, if you are stuck for 2 minutes, move on and come back later.'}</p><div class="work"><span class="tag">Working</span>${work||(q.work||[]).map(w=>`<div>${w}</div>`).join('')}</div>
    <div><button class="btn primary" id="gNext">${last?'See my report card':nextSt?`On to ${RQSTAGE[RQ.list[RQ.i+1].st].name} →`:'Next question →'}</button></div></div>`;
  $('gNext').onclick=()=>{sfx.tap();if(last)return rqReport();RQ.i++;nextSt?rqStageIntro():rqShow();window.scrollTo({top:0,behavior:calm?'auto':'smooth'})};
  $('gf').scrollIntoView({behavior:calm?'auto':'smooth',block:'nearest'})}

const RQTIP={whole:'Do brackets first, then × and ÷, then + and −. For "least number of rolls or boxes", always round UP.',
  frac:'Draw a model. For "the remaining" questions, work out the fraction of what is left, one step at a time. If equal amounts are given away, make the numerators the same.',
  dec:'Line up the decimal points. To multiply by 20 or 60, multiply by 2 or 6 first, then by 10.',
  pct:'Percentage change is always compared with the ORIGINAL amount. Write "100% → original" before you start.',
  ratio:'When one person appears in two ratios, make their units the same (use the LCM) before you compare.',
  rate:'Write every rate "per 1": per minute, per unit. For "or part thereof", round the number of blocks UP.',
  alg:'Collect the letter terms and the number terms separately. Substitute the value only at the end, using brackets.',
  avg:'Average × number of items = total. Work with totals, not with averages.',
  meas:'Change everything to the smaller unit first (min, g, ml, cm). Remember 1 h = 60 min, not 100 min.',
  angle:'Mark every angle you find on the figure. Look for equal sides (isosceles), parallel lines and straight lines (180°).',
  area:'Split the figure into rectangles and triangles. The height of a triangle must be at right angles to its base.',
  circ:'For perimeter, trace only the outside edges. Use the π the question gives. A semicircle arc is ½ × π × diameter.',
  vol:'Volume = base area × height. When water is poured, the volume stays the same: find it, then divide by the new base area.',
  pat:'Find what repeats or what is added each time. Write the rule (e.g. 3 × figure number + 1) and test it on Figure 1.',
  data:'Read the scale on the axis before reading any bar or point. "Not possible to tell" is right when a chart shows percentages but no total.'};
function rqReport(){rqClock(false);clearInterval(RQ.iv);RQ.iv=0;rqCalcShow(false);const pc=RQ.max?Math.round(RQ.got/RQ.max*100):0,stars=pc>=85?3:pc>=65?2:pc>=40?1:0;setBest('p6-quest',stars);setTimeout(()=>arcReport('p6-quest',pc,{stars,mode:'solo'}),300);
  const L=RQ.list.filter(x=>x.q),tot=L.reduce((a,x)=>a+x.ms,0),aimTot=L.reduce((a,x)=>a+rqAim(x)*1000,0);
  const T={};L.forEach(x=>{const t=x.gen.topic,got=x.q.parts.reduce((a,p)=>a+(p.got||0),0);T[t]=T[t]||{t,g:0,m:0,ms:0,aim:0,n:0};T[t].g+=got;T[t].m+=x.q.marks;T[t].ms+=x.ms;T[t].aim+=rqAim(x)*1000;T[t].n++});
  const tops=Object.values(T).map(o=>{o.acc=o.g/o.m;o.pace=o.ms/Math.max(1,o.aim);o.v=o.acc>=.75?(o.pace<=1.1?'strong':'slow'):o.acc<.6&&o.pace<.6?'rush':'revise';return o}).sort((a,b)=>a.acc-b.acc||b.pace-a.pace);
  const VN={strong:['✅ Strong','good'],slow:['🐢 Accurate but slow','sun'],rush:['⚡ Rushing','sun'],revise:['📘 Revise','bad']};
  const bar=(g,m)=>{const p=Math.round(g/m*100);return `<span class="rqbar"><i style="width:${p}%;background:${p>=75?'var(--good)':p>=50?'var(--sun)':'var(--bad)'}"></i></span>`};
  const pbar=(ms,aim)=>{const r=ms/Math.max(1,aim),w=Math.min(100,r*66);return `<span class="rqbar rqpbar" title="66% mark = suggested time"><i style="width:${w}%;background:${r<=1?'var(--good)':r<=1.5?'var(--sun)':'var(--bad)'}"></i><em></em></span>`};
  const tips=[];
  tops.filter(o=>o.v!=='strong').slice(0,4).forEach(o=>{const link=RQLINK[o.t]&&GAMES[RQLINK[o.t]]?` <a href="#${RQLINK[o.t]}">Practise with ${GAMES[RQLINK[o.t]].title} →</a>`:'';
    if(o.v==='slow')tips.push(`<b>${RQT[o.t]}:</b> you scored well but took ${mmss(o.ms)} (aim ${mmss(o.aim)}). You know this, so build speed: time yourself on 5 quick questions a day. ${RQTIP[o.t]||''}`);
    else if(o.v==='rush')tips.push(`<b>${RQT[o.t]}:</b> you went fast (${mmss(o.ms)}) but lost marks. Slow down: underline the key words, check the units, and re-read what the question asks for.`);
    else tips.push(`<b>${RQT[o.t]}:</b> ${RQTIP[o.t]||'Go through the working for each question you missed.'}${link}`)});
  const slowQ=L.map((x,i)=>({x,i})).filter(o=>o.x.ms>rqAim(o.x)*2000);
  if(slowQ.length)tips.push(`<b>Pacing:</b> ${slowQ.map(o=>`Q${o.i+1}`).join(', ')} took more than twice the suggested time. In the exam, if you are stuck for about 2 minutes, mark the question, move on, and come back at the end.`);
  ['A','B','C'].forEach(s=>{const xs=L.filter(x=>x.st===s);if(!xs.length)return;const ms=xs.reduce((a,x)=>a+x.ms,0),aim=xs.reduce((a,x)=>a+rqAim(x)*1000,0);
    if(ms>aim*1.25)tips.push(`<b>${RQSTAGE[s].name}:</b> took ${mmss(ms)} against a suggested ${mmss(aim)}. ${s==='A'?'Aim for about 1 minute per mark on MCQs. Eliminate options that are clearly wrong first.':s==='B'?'Short answers should take about 3 minutes each. Write neat working so you do not have to restart.':'Plan the long questions: write what you know, draw a model, then calculate. Use the calculator for big numbers, not for thinking.'}`)});
  if(tot<aimTot*.5&&pc<70)tips.push('<b>Use your time:</b> you finished well within the suggested time but lost marks. In the real paper, use the spare time to check every answer, starting with the ones you were unsure of.');
  if(!tips.length)tips.push('<b>Great balance of speed and accuracy!</b> Try the Stretch difficulty or a full mock quest to keep improving. In the real exam, use any spare time to check Paper 2 with the calculator.');
  const qrows=L.map((x,i)=>{const got=x.q.parts.reduce((a,p)=>a+(p.got||0),0),r=x.ms/(rqAim(x)*1000);return `<tr><td>Q${i+1}</td><td>${RQSTAGE[x.st].icon}</td><td style="text-align:left">${RQT[x.gen.topic]}</td><td>${RQLVN[x.gen.lv]}</td><td>${fmtN(got)}/${x.q.marks}</td><td class="${r>1.5?'tbad':r>1?'tmid':'tgood'}">${mmss(x.ms)}</td><td>${mmss(rqAim(x)*1000)}</td></tr>`}).join('');
  $('gStage').innerHTML=`<div class="end rqrep"><span class="tag">${RQQUEST[RQ.qk].name}${RQ.topic?': '+RQT[RQ.topic]:''} · ${RQMIX[RQ.mix].name} · report card</span><h3>You scored ${fmtN(RQ.got)} out of ${RQ.max} marks (${pc}%)</h3>
    <p class="big">${starStr(stars)}</p><p>${stars===3?'Outstanding! You are exam-ready on these topics.':stars===2?'Solid work! A little more practice on the topics below and you will be flying.':stars===1?'A good start. Use the working to learn from each mistake, then try again.':'Every expert started here. Go through the topics below one at a time.'}</p>
    <div class="rqtimes"><div><small>Total time</small><b>${mmss(tot)}</b><small>suggested ${mmss(aimTot)}</small></div>${['A','B','C'].filter(s=>RQ.byS[s]).map(s=>{const xs=L.filter(x=>x.st===s),ms=xs.reduce((a,x)=>a+x.ms,0),aim=xs.reduce((a,x)=>a+rqAim(x)*1000,0);return `<div><small>${RQSTAGE[s].icon} ${RQSTAGE[s].name}</small><b class="${ms>aim*1.25?'tbad':ms>aim?'tmid':'tgood'}">${mmss(ms)}</b><small>${fmtN(RQ.byS[s][0])}/${RQ.byS[s][1]} marks · aim ${mmss(aim)}</small></div>`}).join('')}</div>
    <h4>Marks and time by topic</h4><div class="rqtt"><div class="rqtr2 hd"><span>Topic</span><span>Marks</span><span>Time (bar ends at 1.5 × aim)</span><span>Verdict</span></div>${tops.map(o=>`<div class="rqtr2"><span>${RQT[o.t]}</span><span>${bar(o.g,o.m)}<b>${fmtN(o.g)}/${o.m}</b></span><span>${pbar(o.ms,o.aim)}<b>${mmss(o.ms)}</b><small> / ${mmss(o.aim)}</small></span><span class="rqv ${VN[o.v][1]}">${VN[o.v][0]}</span></div>`).join('')}</div>
    <div class="rqweak"><h4>Tips to improve</h4><ul>${tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <details class="rqdet"><summary>Question by question</summary><table class="rqt"><tr><th>Q</th><th>Paper</th><th>Topic</th><th>Level</th><th>Marks</th><th>Time</th><th>Aim</th></tr>${qrows}</table></details>
    <div class="row"><button class="btn primary" id="rqAgain">Play this quest again</button><button class="btn" id="rqHome">Choose another quest</button></div></div>`;
  $('rqAgain').onclick=()=>{sfx.tap();RQMIXK=RQ.mix;rqGo(RQ.qk,RQ.topic)};$('rqHome').onclick=()=>{sfx.tap();rqHome($('gStage'))};
  if(stars>=2){sfx.win();confetti(160,true)}qubi('gQ','party',stars>=2?'What a quest!':'Keep going, you are improving!',true);window.scrollTo({top:0,behavior:calm?'auto':'smooth'})}

function rqCalcShow(on){let c=$('rqCalc');if(!c){if(!on)return;document.body.insertAdjacentHTML('beforeend',`<div class="rqcalc" id="rqCalc" hidden role="dialog" aria-label="Calculator">

    <div class="rqck">${CKEYS.map(([k,l])=>`<button class="btn ${'÷×−+'.includes(k)?'op':''} ${k==='='?'eq':''} ${k==='CH'?'wide':''}" data-k="${k}" aria-label="${{'⁄':'Fraction','‿':'Mixed number','²':'Square','SD':'Switch fraction or decimal','◀':'Move left','▶':'Move right','⌫':'Delete','CH':'Clear the calculation list'}[k]||k}">${l}</button>`).join('')}</div>
    <button class="btn" id="rqcUse">Copy answer into the answer box</button>
    <small class="rqctip">Fraction: type the top number, tap ${FRK}, then type the bottom number. Mixed number: type the whole number, tap ${MXK}, type the top number, tap ▶, then type the bottom number. If a question says "Take π = 3.14" or "22/7", type that number instead of using the π key.</small></div>`);
    c=$('rqCalc');c.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{calcKey(b.dataset.k);sfx.tap()}});$('rqCx').onclick=()=>rqCalcShow(false);

  $('view').querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.dataset.l;try{localStorage.setItem('arcLevel',level)}catch(e){}sfx.tap();hub()})}

addEventListener('hashchange',route);route();
