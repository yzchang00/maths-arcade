<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maths Arcade · Secondary Visual Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* VOICE: playful arcade, but the maths is exact and the feedback is a teacher's.
   IDEA: a lab bench of moving models: each applet is a "cabinet" you open and play with.
   PICTURE: the live model itself (graph, circle, discs) fills the first screen of every applet.
   COLOUR and TYPE: Maths Arcade's own palette (teal, tomato, sun, violet on mint), Fredoka + Nunito.
   LAYOUT: hub of cabinets by level; applet = model left, controls right, stacks below 760px. */
:root{color-scheme:light;
  --bg:#edf4f2;--surface:#fff;--ink:#16233a;--muted:#56667b;--line:#cddbdb;--soft:#e1eeeb;
  --teal:#0b968b;--tomato:#ef5240;--sun:#ffb81f;--violet:#5f50ec;--good:#12985a;--bad:#de3f46;
  --display:"Fredoka",ui-rounded,system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0e191c;--surface:#172528;--ink:#e7f2f0;--muted:#9db2af;--line:#2a3d41;--soft:#1c3033;
  --teal:#38c4b8;--tomato:#ff7b6b;--sun:#ffc94f;--violet:#9a8fff;--good:#45d08a;--bad:#ff6f73}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0e191c;--surface:#172528;--ink:#e7f2f0;--muted:#9db2af;--line:#2a3d41;--soft:#1c3033;
  --teal:#38c4b8;--tomato:#ff7b6b;--sun:#ffc94f;--violet:#9a8fff;--good:#45d08a;--bad:#ff6f73}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow-x:clip}
.app{max-width:1120px;margin:0 auto;padding:14px max(16px,4vw) 56px;display:grid;gap:20px}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:700 1.3rem var(--display);display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit}
.brand i{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--sun);color:#16233a;display:grid;place-items:center;font-size:1.05rem;transform:rotate(-6deg)}
.btn{font:800 15px var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;min-height:44px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg)}
.pill{font:800 13px var(--body);border:2px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
/* hub */
.hero h1{font:700 clamp(2.2rem,7vw,3.6rem)/1 var(--display);margin:0}
.hero h1 span{color:var(--tomato)}
.hero p{margin:10px 0 0;color:var(--muted);max-width:62ch;font-weight:600}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.levels button{font:600 1.05rem var(--display);border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 18px;cursor:pointer;min-height:44px}
.levels button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lvl{display:grid;gap:12px}
.lvl h2{font:600 1.25rem var(--display);margin:0;display:flex;align-items:center;gap:10px}
.lvl h2 small{font:700 14px var(--body);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;text-decoration:none;color:inherit;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;transition:border-color .15s,transform .15s}
.gcard:hover{border-color:var(--c);transform:translateY(-2px)}
.gl{width:64px;height:64px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font:700 1.35rem var(--display);line-height:1}
.gcard b{font:600 1.15rem var(--display);display:block;line-height:1.2}
.gcard small{display:block;color:var(--muted);font-weight:800;font-size:12.5px;margin-top:2px}
.gcard span.d{display:block;font-size:14px;margin-top:4px}
.stars{color:var(--sun);letter-spacing:2px}
/* applet screen */
.back{font:800 15px var(--body);color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;background:var(--surface)}
.ghead .tag{font:800 13px var(--body);color:var(--c)}
.ghead h2{font:700 clamp(1.8rem,5vw,2.5rem)/1.05 var(--display);margin:2px 0 6px}
.ghead p{margin:0;color:var(--muted);max-width:66ch;font-weight:600}
.tabs{display:flex;gap:8px}
.tabs button{font:600 1.05rem var(--display);border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 16px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.stage{background:var(--surface);border:2px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--c);padding:18px;display:grid;gap:16px}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.fig svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ctl{display:grid;gap:14px;align-content:start}
.sl{display:grid;gap:2px;font-weight:800;font-size:15px}
.sl span{display:flex;justify-content:space-between;gap:8px}
.sl b{font-variant-numeric:tabular-nums;color:var(--violet)}
input[type=range]{width:100%;height:32px;accent-color:var(--violet);margin:0}
select{font:700 16px var(--body);border:2px solid var(--ink);border-radius:10px;padding:6px 8px;background:var(--surface);color:var(--ink);min-height:44px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:800 14px var(--body);border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--violet);background:var(--violet);color:#fff}
.stp{display:grid;grid-template-columns:1fr 44px 56px 44px;align-items:center;gap:6px;font-weight:800}
.stp button{font:700 1.3rem var(--display);height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.stp output{font:700 1.4rem var(--display);text-align:center;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:8px;align-items:center;font-weight:800;cursor:pointer;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--violet)}
.read{display:grid;gap:8px;font-size:16px}
.read p{margin:0}
.eq{font:600 1.45rem var(--display)}
.big{font:700 clamp(1.5rem,4vw,2rem) var(--display)}
.say{margin:0;border-left:4px solid var(--c);padding:6px 0 6px 12px;font-weight:600}
.warn{border-left-color:var(--tomato);background:color-mix(in srgb,var(--tomato) 8%,transparent);border-radius:0 10px 10px 0}
.watch{background:var(--soft);border-radius:16px;padding:14px 18px}
.watch h3{font:600 1.1rem var(--display);margin:0 0 6px}
.watch ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-size:.86em;margin:0 .12em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .18em}
.col{display:inline-grid;vertical-align:middle;text-align:center;line-height:1.1;padding:0 .45em;position:relative;font-variant-numeric:tabular-nums}
.col::before,.col::after{content:"";position:absolute;top:0;bottom:0;width:.35em;border:2px solid currentColor}
.col::before{left:0;border-right:0;border-radius:.5em 0 0 .5em}.col::after{right:0;border-left:0;border-radius:0 .5em .5em 0}
.mx{display:inline-grid;gap:2px 14px;padding:4px 12px;position:relative;vertical-align:middle;font:700 1.15rem var(--display);text-align:center;font-variant-numeric:tabular-nums}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:8px;border:2.5px solid currentColor}
.mx::before{left:0;border-right:0;border-radius:10px 0 0 10px}.mx::after{right:0;border-left:0;border-radius:0 10px 10px 0}
.mx span{min-width:1.6em;padding:2px 4px;border-radius:6px}
.mx span.r{background:color-mix(in srgb,var(--tomato) 22%,transparent)}
.mx span.c{background:color-mix(in srgb,var(--teal) 25%,transparent)}
.mx button{font:700 1.15rem var(--display);min-width:2.4em;min-height:40px;border:2px dashed var(--muted);border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer}
.mx button.on{border:2px solid var(--violet);background:color-mix(in srgb,var(--violet) 18%,var(--surface))}
.mxrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font:700 1.3rem var(--display)}
/* quiz */
.qn{margin:0;font:800 13px var(--body);color:var(--muted)}
.qt{font-size:1.2rem;font-weight:800;margin:0;text-wrap:pretty}
.qfig{max-width:440px}
.qfig svg{width:100%;height:auto;display:block}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.choices{grid-template-columns:minmax(0,1fr)}}
.choices .btn{font:600 1.2rem var(--display);min-height:58px;text-align:center}
.choices .btn.right{background:var(--good);border-color:var(--good);color:#fff}
.choices .btn.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{border-radius:14px;padding:14px;display:grid;gap:8px;border:2px solid var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.fb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.fb p{margin:0}
.fbt{font:600 1.3rem var(--display);color:var(--good)}
.fb.no .fbt{color:var(--bad)}
.end{display:grid;gap:12px;justify-items:start}
.end .stars{font-size:3rem;letter-spacing:6px;line-height:1}
.end h3{font:700 2rem var(--display);margin:0}
/* svg classes */
svg text{font-family:var(--body);font-weight:800;fill:var(--ink)}
.gl1{stroke:var(--line);stroke-width:1}
.ax{stroke:var(--ink);stroke-width:2}
.tk{font-size:13px;fill:var(--muted)!important}
.ink{stroke:var(--ink)}
.dot{fill:var(--ink)}
.hit{cursor:grab}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
{
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const M='−';
const num=(x,dp=2)=>{if(Math.abs(x)<1e-9)return'0';const r=Math.round(x*10**dp)/10**dp;return String(r).replace('-',M)};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const frac=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;if(d===1)return num(n);return(n<0?M:'')+`<span class="fr"><span>${Math.abs(n)}</span><span>${d}</span></span>`};
const br=n=>n<0?`(${num(n)})`:num(n);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* signed term: coefficient c of v (v '' for constant) */
function term(c,v,first){if(!c)return'';const s=c<0?M:'+';const a=Math.abs(c);const body=(v&&a===1)?v:num(a)+v;return first?(c<0?M:'')+body:` ${s} ${body}`}
function poly(cs,vs){let out='',first=true;cs.forEach((c,i)=>{if(c){out+=term(c,vs[i],first);first=false}});return out||'0'}
const P2=(a,b,c)=>poly([a,b,c],['x²','x','']);
const colv=(x,y)=>`<span class="col"><span>${num(x)}</span><span>${num(y)}</span></span>`;
const mxh=(rows,cls)=>`<span class="mx" style="grid-template-columns:repeat(${rows[0].length},auto)">${rows.map((r,i)=>r.map((v,j)=>`<span class="${cls?cls(i,j):''}">${num(v)}</span>`).join('')).join('')}</span>`;
function plane(o){const W=o.W||520,H=o.H||520,{x0,x1,y0,y1}=o;const sx=W/(x1-x0),sy=H/(y1-y0);
  const X=x=>(x-x0)*sx,Y=y=>H-(y-y0)*sy;
  function grid(step=1,lab=2,ys=step,ylab=lab){let s='';
    for(let x=Math.ceil(x0/step)*step;x<=x1+1e-9;x+=step)s+=`<line class="gl1" x1="${X(x)}" y1="0" x2="${X(x)}" y2="${H}"/>`;
    for(let y=Math.ceil(y0/ys)*ys;y<=y1+1e-9;y+=ys)s+=`<line class="gl1" x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}"/>`;
    if(y0<=0&&y1>=0)s+=`<line class="ax" x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}"/><text x="${W-12}" y="${Y(0)-8}" font-size="15">x</text>`;
    if(x0<=0&&x1>=0)s+=`<line class="ax" x1="${X(0)}" y1="0" x2="${X(0)}" y2="${H}"/><text x="${X(0)+8}" y="16" font-size="15">y</text>`;
    const ly=Math.min(Math.max(Y(0)+17,14),H-4),lx=Math.min(Math.max(X(0)-6,26),W-4);
    for(let x=Math.ceil(x0/lab)*lab;x<=x1+1e-9;x+=lab)if(Math.abs(x)>1e-9&&x>x0&&x<x1)s+=`<text class="tk" x="${X(x)}" y="${ly}" text-anchor="middle">${num(x)}</text>`;
    for(let y=Math.ceil(y0/ylab)*ylab;y<=y1+1e-9;y+=ylab)if(Math.abs(y)>1e-9&&y>y0&&y<y1)s+=`<text class="tk" x="${lx}" y="${Y(y)+4}" text-anchor="end">${num(y)}</text>`;
    return s}
  return{W,H,X,Y,grid,ix:p=>x0+p/sx,iy:p=>y0+(H-p)/sy}}
function sp(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function dragger(svg,cb){let k=null;
  svg.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-drag]');if(!t)return;k=t.dataset.drag;try{svg.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();cb(k,sp(svg,e))});
  svg.addEventListener('pointermove',e=>{if(k)cb(k,sp(svg,e))});
  const up=()=>{k=null};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up)}
function arrow(x1,y1,x2,y2,col,w=3.5,dash){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<2)return'';const ux=dx/L,uy=dy/L,hs=Math.min(15,L*.45),bx=x2-ux*hs,by=y2-uy*hs;
  return`<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" style="stroke:${col}" stroke-width="${w}" ${dash?'stroke-dasharray="7 6"':''} stroke-linecap="round"/><polygon points="${x2},${y2} ${bx-uy*hs*.55},${by+ux*hs*.55} ${bx+uy*hs*.55},${by-ux*hs*.55}" style="fill:${col}"/>`}
const lbl=(x,y,t,col='var(--ink)',fs=16,anc='middle')=>`<text x="${x}" y="${y}" text-anchor="${anc}" font-size="${fs}" style="fill:${col};paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round">${t}</text>`;
function sliders(el,st,draw,fmt={}){$$('input[type=range]',el).forEach(i=>{const k=i.dataset.k;const show=()=>{const b=$(`b[data-k="${k}"]`,el);if(b)b.innerHTML=(fmt[k]||num)(st[k])};show();i.addEventListener('input',()=>{st[k]=+i.value;show();draw()})})}
const sl=(k,label,min,max,step,v)=>`<label class="sl"><span>${label}<b data-k="${k}"></b></span><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${v}"></label>`;
function seg(el,sel,st,key,draw){$$(sel+' button',el).forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===String(st[key]));b.addEventListener('click',()=>{st[key]=b.dataset.v;$$(sel+' button',el).forEach(x=>x.setAttribute('aria-pressed',x===b));draw()})})}
/* angle arc: centre (cx,cy) svg, from math-angle a1 to a2 counter-clockwise */
function sector(cx,cy,r,a1,a2,style){const p=a=>[cx+r*Math.cos(rad(a)),cy-r*Math.sin(rad(a))];const[x1,y1]=p(a1),[x2,y2]=p(a2);const sw=((a2-a1)%360+360)%360;
  return`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${sw>180?1:0} 0 ${x2},${y2} Z" style="${style}"/>`}
const mang=(x,y)=>(deg(Math.atan2(-y,x))+360)%360; /* math angle of svg vector */

/* ---------- quiz engine (wrong options = real misconceptions) ---------- */
function quiz(el,app,n=6){let i=0,score=0;
  function show(){if(i>=n)return end();const q=app.gen(i);const seen=new Set();
    const ch=q.choices.filter(c=>{if(seen.has(c.t))return false;seen.add(c.t);return true});shuffle(ch);
    el.innerHTML=`<p class="qn">Question ${i+1} of ${n} · score ${score}</p>${q.fig?`<div class="qfig">${q.fig}</div>`:''}<p class="qt">${q.prompt}</p><div class="choices">${ch.map((c,k)=>`<button class="btn" data-k="${k}">${c.t}</button>`).join('')}</div><div id="qf"></div>`;
    $$('.choices .btn',el).forEach(b=>b.addEventListener('click',()=>{const c=ch[+b.dataset.k];$$('.choices .btn',el).forEach(x=>{x.disabled=true;if(ch[+x.dataset.k].ok)x.classList.add('right')});
      if(c.ok)score++;else b.classList.add('wrong');
      $('#qf',el).innerHTML=`<div class="fb ${c.ok?'':'no'}"><p class="fbt">${c.ok?pick(['Spot on.','Correct!','Nailed it.']):'Not quite.'}</p>${c.ok?'':`<p>${c.why||''}</p>`}<p>${q.explain}</p><div><button class="btn primary" id="qn">${i+1<n?'Next question':'See score'}</button></div></div>`;
      $('#qn',el).addEventListener('click',()=>{i++;show()});$('#qn',el).focus()}))}
  function end(){const st=score>=n?3:score>=n-1?2:score>=Math.ceil(n/2)?1:0;const key='vlab-'+app.id;const best=store.get(key)||0;if(st>best)store.set(key,st);
    el.innerHTML=`<div class="end"><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><h3>${score} out of ${n}</h3><p>${score===n?'Perfect round. Try Explore mode on a harder setting, or move to the next topic.':'Every wrong option here is a mistake real students make. Read the feedback, then play again.'}</p><button class="btn primary" id="qa">Play again</button></div>`;
    $('#qa',el).addEventListener('click',()=>{i=0;score=0;show()})}
  show()}

/* ================= APPLETS ================= */
const A=[];

/* ---- Sec 1: Zero-pair zapper ---- */
const dz=n=>n===0?'no discs':`${Math.abs(n)} ${n>0?'+1':M+'1'} disc${Math.abs(n)>1?'s':''}`;
function discSteps(a,b,op){const P=[],N=[],S=[];const snap=note=>S.push({P:P.slice(),N:N.slice(),note});
  const put=(n,s)=>{for(let i=0;i<Math.abs(n);i++)(n>0?P:N).push(s)};
  put(a,'n');snap(`Start with ${br(a)}: ${dz(a)}.`);
  if(op==='+'){put(b,'new');snap(`Add ${br(b)}: put in ${dz(b)}.`);const k=Math.min(P.length,N.length);
    if(k){for(let i=0;i<k;i++){P[i]='pair';N[i]='pair'}snap(`A +1 and a ${M}1 make a zero pair, worth 0. There ${k===1?'is 1 zero pair':'are '+k+' zero pairs'}. Remove them.`);P.splice(0,k);N.splice(0,k)}}
  else{const s=Math.sign(b),nb=Math.abs(b),R=s>0?P:N,need=Math.max(0,nb-R.length);
    if(need){for(let i=0;i<need;i++){P.push('zero');N.push('zero')}snap(`To take away ${dz(b)} we need ${nb} ${s>0?'+1':M+'1'} disc${nb>1?'s':''}, but only have ${nb-need}. Add ${need} zero pair${need>1?'s':''}. That adds 0, so the value is still ${br(a)}.`)}
    if(nb){for(let i=R.length-nb;i<R.length;i++)R[i]='gone';snap(`Take away ${dz(b)}.`);R.splice(R.length-nb,nb)}}
  P.fill('n');N.fill('n');const r=op==='+'?a+b:a-b;
  snap(`Left over: ${dz(r)}. So ${br(a)} ${op==='+'?'+':M} ${br(b)} = ${num(r)}.`+(op==='-'&&b<0?` Taking away negatives leaves more behind: subtracting a negative is the same as adding a positive.`:''));return S}

function triSVG(o){/* o: {adj,opp,ref:'A'|'B',theta,labels:{adj,opp,hyp}, sc} right angle at C */

  for(const k in sides){const[x1,y1,x2,y2]=sides[k];s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${colr[role[k]]}" stroke-width="${o.plain?4:6}" stroke-linecap="round"/>`}
  s+=`<path d="M${Cx-22},${Cy} v-22 h22" fill="none" class="ink" stroke-width="2.5"/>`;
  const ang=deg(Math.atan2(o.opp,o.adj));
  if(o.ref==='A')s+=sector(Ax,Ay,46,0,ang,'fill:var(--sun);fill-opacity:.7;stroke:var(--ink);stroke-width:1.5')+lbl(Ax+64,Ay-12,'θ','var(--ink)',20);
  else s+=sector(Bx,By,46,180+ang,270,'fill:var(--sun);fill-opacity:.7;stroke:var(--ink);stroke-width:1.5')+lbl(Bx-18,By+70,'θ','var(--ink)',20);
  const L=o.labels||{};const tag=k=>L[role[k]]!==undefined?L[role[k]]:'';
  s+=lbl((Ax+Cx)/2,Ay+26,tag('AC'),colr[role.AC],17)+lbl(Cx+12,(By+Cy)/2+6,tag('BC'),colr[role.BC],17,'start')+lbl((Ax+Bx)/2-18,(Ay+By)/2-8,tag('AB'),colr.hyp,17,'end');
  return`<svg viewBox="0 0 ${W} ${H+20}">${s}</svg>`}

    el.innerHTML=`<div class="two"><div class="fig"><svg id="pp" viewBox="0 0 520 520" role="img" aria-label="Two lines and gradient triangles"></svg></div><div class="ctl">${sl('rise','Rise',-4,4,1,2)}${sl('run','Run',1,4,1,3)}<div class="row"><button class="btn primary" id="prot">Rotate 90°</button><button class="btn" id="pres">Reset</button></div><label class="chk"><input type="checkbox" id="psq"> Squash the y-axis</label><div class="read" id="prr"></div></div></div>`;
    const svg=$('#pp',el);
    function tri(rise,run,col,ang){const ox=P.X(0),oy=P.Y(0);const pts=[[0,0],[run,0],[run,rise]].map(([x,y])=>{const c=Math.cos(rad(ang)),s=Math.sin(rad(ang));return[x*c-y*s,x*s+y*c]});
      return`<polygon points="${pts.map(([x,y])=>`${P.X(x)},${P.Y(y)}`).join(' ')}" style="fill:${col};fill-opacity:.18;stroke:${col}" stroke-width="3"/>`+(()=>{const[a,b]=pts[1],[c,d]=pts[2];return`<line x1="${ox}" y1="${oy}" x2="${P.X(a)}" y2="${P.Y(b)}" style="stroke:var(--teal)" stroke-width="5"/><line x1="${P.X(a)}" y1="${P.Y(b)}" x2="${P.X(c)}" y2="${P.Y(d)}" style="stroke:var(--tomato)" stroke-width="5"/>`})()}
    function line(dx,dy,col){const L=12/Math.hypot(dx,dy);return`<line x1="${P.X(-dx*L)}" y1="${P.Y(-dy*L)}" x2="${P.X(dx*L)}" y2="${P.Y(dy*L)}" style="stroke:${col}" stroke-width="3.5"/>`}
    function draw(){const{rise,run,rot}=st;let o=P.grid(1,2)+line(run,rise,'var(--violet)')+tri(rise,run,'var(--violet)',0);
      if(rot>0){const c=Math.cos(rad(rot)),s=Math.sin(rad(rot));o+=line(run*c-rise*s,run*s+rise*c,'var(--tomato)')+tri(rise,run,'var(--tomato)',rot)}
      if(st.squash)o=`<g transform="translate(0,${P.Y(0)}) scale(1,.5) translate(0,${-P.Y(0)})">${o}</g>`;svg.innerHTML=o;
      const done=rot>=90;$('#prr',el).innerHTML=`<p class="eq">m₁ = rise ÷ run = ${frac(rise,run)}</p>`+(done?(rise===0?`<p>The flat line turned into a vertical line. Horizontal and vertical lines are perpendicular, but a vertical line has no gradient, so m₁m₂ = ${M}1 can't be used here.</p>`:`<p>After turning 90°: the run (${run}) now points <b>up</b>, and the rise (${num(rise)}) now points <b>${rise>0?'left':'right'}</b>.</p><p class="eq" style="color:var(--tomato)">m₂ = ${run} ÷ ${br(-rise)} = ${frac(-run,rise)}</p><p>Swap rise and run: <b>reciprocal</b>. One of them changes direction: <b>negative</b>.</p><p class="eq">m₁ × m₂ = ${frac(rise,run)} × ${frac(-run,rise)} = ${M}1</p>`):'<p>Press <b>Rotate 90°</b> to turn the triangle and the line together.</p>')+(st.squash?`<p class="say warn">Same lines, same gradients, but on unequal scales they don't <i>look</i> perpendicular. Use equal scales before judging by eye.</p>`:'');}
    $('#prot',el).onclick=()=>{cancelAnimationFrame(raf);st.rot=0;const t0=performance.now();const go=t=>{st.rot=Math.min(90,(t-t0)/10);draw();if(st.rot<90&&document.body.contains(svg))raf=requestAnimationFrame(go)};raf=requestAnimationFrame(go)};
    $('#pres',el).onclick=()=>{cancelAnimationFrame(raf);st.rot=0;draw()};$('#psq',el).onchange=e=>{st.squash=e.target.checked;draw()};sliders(el,st,()=>{st.rot=0;draw()});draw()},
  gen(i){if(i%2===0){let n,d;do{n=ri(-5,5);d=ri(1,5)}while(!n||Math.abs(n)===d||gcd(n,d)>1);
      return{prompt:`Line L has gradient ${frac(n,d)}. What is the gradient of a line perpendicular to L?`,choices:[{t:frac(-d,n),ok:true},{t:frac(-n,d),why:'You changed the sign but didn\'t flip the fraction. Negative reciprocal means both.'},{t:frac(d,n),why:'You flipped the fraction but didn\'t change the sign. Negative reciprocal means both.'},{t:frac(n,d),why:'That\'s the gradient of a parallel line.'}],explain:`m₂ = ${M}1 ÷ m₁ = ${frac(-d,n)}. Check: ${frac(n,d)} × ${frac(-d,n)} = ${M}1.`}}
    let a,b,c;do{a=ri(1,5);b=ri(2,5);c=ri(1,12)}while(a===b||gcd(a,b)>1);
    return{prompt:`Find the gradient of a line perpendicular to ${a}x + ${b}y = ${c}.`,choices:[{t:frac(b,a),ok:true},{t:frac(-1,a),why:`First make y the subject: y = ${frac(-a,b)}x + …, so the gradient is ${frac(-a,b)}, not ${a}.`},{t:frac(-a,b),why:'That\'s the gradient of the line itself. Now take the negative reciprocal.'},{t:frac(-b,a),why:`The line's gradient is ${frac(-a,b)}, which is negative, so the perpendicular gradient is positive.`}],explain:`${a}x + ${b}y = ${c} gives y = ${frac(-a,b)}x + ${frac(c,b)}. Perpendicular gradient = ${M}1 ÷ (${frac(-a,b)}) = ${frac(b,a)}.`}}});

/* ================= SHELL ================= */
const LV={s1:['Secondary 1','G3 Maths'],s2:['Secondary 2','G3 Maths'],s3:['Secondary 3/4','G3 Maths'],am:['Additional Maths','Sec 3/4']};
let filter=store.get('vlab-filter')||'all';
const app=$('#app');
const top=`<div class="topbar"><a class="brand" href="index.html#secondary"><i>∑</i>Maths Arcade · Visual Lab</a><span class="pill">Sec 1–4 · E-Maths and A-Maths</span></div>`;
function hub(){const lv=Object.keys(LV).filter(k=>filter==='all'||filter===k);
  app.innerHTML=top+`<section class="hero"><h1>See the maths <span>move</span></h1><p>Drag, slide and spin each model, then take the challenge. Every wrong option in a challenge is a mistake real students make, and the feedback says why.</p></section>
  <div class="levels" role="group" aria-label="Level">${[['all','All'],['s1','Sec 1'],['s2','Sec 2'],['s3','Sec 3/4'],['am','A-Maths']].map(([k,t])=>`<button data-f="${k}" aria-pressed="${filter===k}">${t}</button>`).join('')}</div>`+
  lv.map(k=>`<section class="lvl"><h2>${LV[k][0]} <small>${LV[k][1]}</small></h2><div class="cards">${A.filter(a=>a.lvl===k).map(a=>{const b=store.get('vlab-'+a.id)||0;return`<a class="gcard" href="#${a.id}" style="--c:${a.c}"><span class="gl">${a.g}</span><span><b>${a.title}</b><small>${a.code}</small><span class="d">${a.blurb}</span>${b?`<span class="stars">${'★'.repeat(b)}</span>`:''}</span></a>`}).join('')}</div></section>`).join('');
  $$('.levels button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;store.set('vlab-filter',filter);hub()})}
function screen(a){app.innerHTML=top+`<div style="--c:${a.c};display:grid;gap:18px"><div class="row between"><a class="back" href="index.html#secondary">← Secondary Maths</a></div>
  <div class="ghead"><span class="tag">${LV[a.lvl][0]} · ${a.code}</span><h2>${a.title}</h2><p>${a.blurb}</p></div>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="x">Explore</button><button role="tab" aria-selected="false" data-t="c">${a.game?'Play':'Challenge'}</button></div>
  <div class="stage" id="st"></div><div class="watch"><h3>Watch out for</h3><ul>${a.watch.map(w=>`<li>${w}</li>`).join('')}</ul></div></div>`;
  const st=$('#st');const go=t=>{$$('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));if(t==='x')a.explore(st);else if(a.game)a.game(st);else quiz(st,a)};
  $$('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));go('x');window.scrollTo(0,0)}
function route(){const id=location.hash.slice(1);const a=A.find(x=>x.id===id);if(a)screen(a);else location.replace('index.html#secondary')}
window.addEventListener('hashchange',route);route();
}
</script>
