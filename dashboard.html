<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade Tracker</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#edf4f2;--surface:#fff;--ink:#16233a;--muted:#56667b;--line:#cddbdb;--soft:#e1eeeb;--teal:#0b968b;--violet:#5f50ec;--bad:#de3f46;--sun:#ffb81f}
@media (prefers-color-scheme:dark){:root{--bg:#0e191c;--surface:#172528;--ink:#e7f2f0;--muted:#9db2af;--line:#2a3d41;--soft:#1c3033}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:18px}
h1{font:700 2rem Fredoka,system-ui;margin:0}h2{font:600 1.25rem Fredoka,system-ui;margin:0 0 10px}
.backarc{display:inline-flex;align-items:center;gap:6px;font:800 15px Nunito,system-ui;color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;text-decoration:none;margin-bottom:10px}.backarc:hover{background:var(--ink);color:var(--surface)}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btn{font:800 15px Nunito,system-ui;color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:7px 14px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}.btn.sm{padding:3px 10px;font-size:13px;border-width:1.5px}
select,input{font:700 15px Nunito,system-ui;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;background:var(--surface);color:var(--ink)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi b{display:block;font:700 2.1rem Fredoka,system-ui;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}td.n,th.n{text-align:right}
.scroll{overflow:auto;max-height:420px}.muted{color:var(--muted)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:18px}.bars div{flex:1;display:grid;justify-items:center;gap:4px;min-width:0}
.bars i{display:block;width:100%;max-width:38px;background:var(--teal);border-radius:6px 6px 2px 2px;position:relative}.bars i em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:700 11px Nunito;color:var(--muted);font-style:normal}
.bars small{font-size:10px;color:var(--muted);white-space:nowrap}
.signin{max-width:440px;margin:12vh auto;text-align:center;display:grid;gap:14px}
.tag{font:800 11px Nunito;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;font:800 12px Nunito;border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
[hidden]{display:none!important}
</style></head>
<body><main id="app"><div class="signin card"><a class="backarc" href="index.html" title="Go back to the Maths Arcade games">← Back to Maths Arcade</a><span class="tag">Maths Arcade</span><h1>Teacher tracker</h1><p class="muted" id="msg">Loading…</p><button class="btn primary" id="go" hidden>Sign in with Google</button></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, query, where, orderBy, limit, deleteDoc, updateDoc, doc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, teacherEmails } from "./firebase-config.js";
const TITLES={"p4-rounding":["Rounding Rocket","P4"],"p4-factors":["Factor Hunt","P4"],"p4-product":["Digit Duel","P4"],"p4-flip":["Fraction Flip","P4"],"p4-share":["Sweet Share","P4"],"p4-target":["Fraction Target","P4"],"p4-decimals":["Decimal Line-Up","P4"],"p4-cashier":["Canteen Cashier","P4"],"p4-garden":["Garden Builder","P4"],"p4-angles":["Angle Sniper","P4"],"p4-mirror":["Mirror Maker","P4"],"p4-nets":["Net Detective","P4"],"p4-graphs":["Graph Reporter","P4"],"p5-vault":["Vault Cracker","P5"],"p5-order":["Operation Order","P5"],"p5-slide":["Place-Value Slide","P5"],"p5-share":["Fair Share","P5"],"p5-fgrid":["Fraction Grid","P5"],"p5-rate":["Rate Station","P5"],"p5-tarea":["Height Finder","P5"],"p5-volume":["Cube Builder","P5"],"p5-angles":["Angle Detective","P5"],"p5-triangles":["Triangle Sorter","P5"],"p5-quads":["Quad Quest","P5"],"p6-fdiv":["Scoop & Share","P6"],"p6-pchange":["Before & After","P6"],"p6-ratio":["Ratio Kitchen","P6"],"p6-algebra":["Balance Scale","P6"],"p6-circle":["Circle Lab","P6"],"p6-cuberoot":["Crate Cracker","P6"],"p6-chain":["Angle Chain","P6"],"p6-average":["Average Leveller","P6"],"p4-diner":["Decimal Diner","P4"],"p4-train":["Train Timetable","P4"],"sg-journeys":["Beat the Clock: SG Journeys","P4"],"sg-journeys-2":["Beat the Clock: SG Journeys 2","P5"],"world-journeys":["Beat the Clock: World Journeys","P6"],"s1-integers":["Below Zero","Sec 1"],"s1-estimate":["Close Enough?","Sec 1"],"p4-compass":["Treasure Map","P4"],"s1-bouncer":["Prime Bouncer","Sec 1"],"s1-split":["Club Prime: Split to Get In","Sec 1"],"s1-tables":["Club Prime: Party Tables","Sec 1"],"s1-news":["Fake News Desk","Sec 1"],"p5-pizza":["Pizza Party Orders","P5"],"p5-pshop":["Percent Shop","P5"],"p6-pie":["Pie Chart Bakery","P6"],"party-tug":["Times Table Tug-of-War","All levels"],"party-bingo":["Number Bingo","All levels"],"party-wall":["Fraction Wall Race","All levels"],"party-team":["Team Battle","All levels"],"p6-quest":["PSLE Quest","P6"]};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=id=>TITLES[id]?TITLES[id][0]:id||'—',lvl=id=>TITLES[id]?TITLES[id][1]:'';
if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('PASTE')){$('msg').textContent='Firebase is not set up yet. Fill in firebase-config.js first (see README).';throw 0}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
$('go').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('msg').textContent='Sign-in failed: '+e.message);
onAuthStateChanged(auth,u=>{/* the games give each device an invisible anonymous ID; that is not a teacher sign-in */if(!u||u.isAnonymous){$('msg').textContent='Sign in with the teacher Google account to see who is using the arcade.';$('go').hidden=false;return}
  const email=(u.email||'').toLowerCase(),no=()=>{$('msg').innerHTML=`${esc(u.email)} does not have access. Ask the admin to add you as a teacher. <button class="btn sm" id="out">Sign out</button>`;$('go').hidden=true;$('out').onclick=()=>signOut(auth)};
  /* Admins (firebase-config.js) see everything. Teachers (a staff/{email} document with their classes) see only the pupils in those classes. */
  if(teacherEmails.map(x=>x.toLowerCase()).includes(email)){ROLE={admin:true,classes:[]};start(u);return}
  getDoc(doc(db,'staff',email)).then(s=>{if(!s.exists())return no();ROLE={admin:false,classes:(s.data().classes||[]).slice(0,10)};start(u)}).catch(no)});
/* ---------- Students: pupils who signed in with Google (users) and every game they finished (plays) ---------- */
let U=[],PL=[],ROLE={admin:true,classes:[]},selUid=null,SERR='';
const mapU=d=>{const x=d.data();return{id:d.id,name:x.name||'',email:x.email||'',nick:x.nick||'',cls:x.cls||'',first:x.first?x.first.toMillis():0,last:x.last?x.last.toMillis():0}};
const mapP=d=>{const x=d.data();return{id:d.id,...x,t:x.ts?x.ts.toMillis():Date.now()}};
const pct=p=>p.max?Math.round(p.score/p.max*100):null,avgOf=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const fmtD=t=>t?new Date(t).toLocaleString('en-SG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'—';
const LVN={easy:'Easy / Core',mixed:'Medium / Stretch',hard:'Hard / Challenge'};
const tone=v=>v==null?'':v<50?'color:var(--bad);font-weight:800':v<70?'color:#b7791f;font-weight:800':'color:var(--teal);font-weight:800';
/* topics a pupil has played, weakest first */
function topicsOf(ps){const T={};ps.forEach(p=>{const v=pct(p);if(v==null)return;const k=p.topic||p.title||p.game,t=T[k]=T[k]||{topic:k,level:p.level||'',game:p.title||p.game,v:[]};t.v.push(v)});
  return Object.values(T).map(t=>({...t,avg:avgOf(t.v),n:t.v.length})).sort((a,b)=>a.avg-b.avg)}
/* accuracy per question type inside one game (from the round-by-round results) */
function typesOf(ps){const Q={};ps.forEach(p=>{const r=p.res||'',rt=(p.rt||'').split(',');for(let i=0;i<r.length;i++){const k=rt[i]!==undefined&&rt[i]!==''?+rt[i]+1:i+1,q=Q[k]=Q[k]||{n:0,pts:0};q.n++;q.pts+=+r[i]}});
  return Object.entries(Q).map(([k,q])=>({k:+k,n:q.n,acc:Math.round(q.pts/(q.n*2)*100)})).sort((a,b)=>a.k-b.k)}
/* ---------- Feedback inbox (admin only): messages, pictures and files sent from Ask Qubi ---------- */
let FB=[],fbShow='new',FBERR='';
const FBK={bug:'🐞 Not working',unclear:'❓ Confusing question',idea:'💡 Idea',other:'💬 Other'};
async function loadFeedback(){FBERR='';try{const s=await getDocs(query(collection(db,'feedback'),orderBy('ts','desc'),limit(300)));FB=s.docs.map(d=>{const x=d.data();return{id:d.id,...x,t:x.ts?x.ts.toMillis():Date.now()}})}
  catch(e){FB=[];FBERR='Could not load feedback ('+e.code+'). Deploy the latest firestore.rules, then press Refresh.'}}
function feedbackCard(){const n=FB.filter(f=>f.status!=='done').length,list=FB.filter(f=>fbShow==='all'||(fbShow==='new'?f.status!=='done':f.status==='done'));
  return `<div class="card" id="fbCard"><div class="row" style="justify-content:space-between"><h2>Feedback inbox <span class="pill">${n} new</span></h2>
   <div class="row">${[['new','New'],['done','Done'],['all','All']].map(([k,l])=>`<button class="btn sm" data-fbs="${k}" ${k===fbShow?'style="background:var(--ink);color:var(--bg)"':''}>${l}</button>`).join('')}</div></div>
   ${FBERR?`<p class="muted">${esc(FBERR)}</p>`:''}<p class="muted" style="margin:0 0 8px">Sent by pupils and visitors from Ask Qubi. Only you can see these.</p>
   <div style="display:grid;gap:10px">${list.map(f=>`<div style="border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px${f.status==='done'?';opacity:.65':''}">
     <div class="row" style="justify-content:space-between;gap:8px"><div><b>${esc(FBK[f.kind]||f.kind||'Feedback')}</b> <span class="muted">· ${fmtD(f.t)} · ${f.signed?esc((f.nick||'Signed-in pupil')+(f.cls?' · '+f.cls:'')):'Guest'}</span></div>
      <div class="row"><button class="btn sm" data-fbd="${esc(f.id)}">${f.status==='done'?'Reopen':'✓ Mark done'}</button><button class="btn sm" data-fbx="${esc(f.id)}">Delete</button></div></div>
     ${f.game||f.page?`<div class="muted" style="font-size:13px">${esc([f.game,f.round,f.level,f.mode].filter(Boolean).join(' · ')||({'#home':'Primary home page','#':'Primary home page','#secondary':'Secondary home page','#start':'Start screen'})[f.page]||f.page)}${f.screen?' · screen '+esc(f.screen):''}</div>`:''}
     ${f.msg?`<div style="white-space:pre-wrap">${esc(f.msg)}</div>`:''}
     ${(f.files||[]).length?`<div class="row" style="gap:8px">${f.files.map((x,i)=>/^image\//.test(x.type)?`<img src="${x.data}" alt="${esc(x.name)}" data-fbi="${esc(f.id)}:${i}" title="Click to open full size" style="max-width:220px;max-height:160px;border:2px solid var(--line);border-radius:8px;cursor:zoom-in">`:`<a class="btn sm" href="${x.data}" download="${esc(x.name)}">📄 ${esc(x.name)}</a>`).join('')}</div>`:''}
   </div>`).join('')||`<p class="muted">${fbShow==='done'?'Nothing marked done yet.':'No new feedback. 🎉'}</p>`}</div></div>`}
function wireFeedback(){document.querySelectorAll('[data-fbs]').forEach(b=>b.onclick=()=>{fbShow=b.dataset.fbs;draw();const c=$('fbCard');if(c)c.scrollIntoView({block:'start'})});
  document.querySelectorAll('[data-fbd]').forEach(b=>b.onclick=async()=>{const f=FB.find(x=>x.id===b.dataset.fbd);if(!f)return;const st=f.status==='done'?'new':'done';b.disabled=true;
    try{await updateDoc(doc(db,'feedback',f.id),{status:st});f.status=st;draw();const c=$('fbCard');if(c)c.scrollIntoView({block:'start'})}catch(e){b.disabled=false;alert('Could not update: '+e.message)}});
  document.querySelectorAll('[data-fbx]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this feedback for good?'))return;b.disabled=true;
    try{await deleteDoc(doc(db,'feedback',b.dataset.fbx));FB=FB.filter(x=>x.id!==b.dataset.fbx);draw()}catch(e){b.disabled=false;alert('Could not delete: '+e.message)}});
  document.querySelectorAll('[data-fbi]').forEach(im=>im.onclick=async()=>{try{const bl=await (await fetch(im.src)).blob(),u=URL.createObjectURL(bl);window.open(u,'_blank')}catch(e){}})}
function studentsCard(){const us=U.filter(x=>!cls||x.cls===cls),by={};PL.forEach(p=>{(by[p.uid]=by[p.uid]||[]).push(p)});
  const rows=us.map(u=>{const ps=by[u.id]||[],tp=topicsOf(ps);return{u,n:ps.length,avg:avgOf(ps.map(pct).filter(v=>v!=null)),weak:tp.length&&tp[0].avg<70?tp[0]:null}}).sort((a,b)=>b.u.last-a.u.last);
  return `<div class="card" id="studCard"><div class="row" style="justify-content:space-between"><h2>Students who signed in <span class="muted" style="font-size:14px">(${rows.length})</span></h2><input id="sfind" placeholder="Search name, email or nickname"></div>
   ${SERR?`<p class="muted">${esc(SERR)}</p>`:''}<p class="muted" style="margin:0 0 8px">Click a student to see every game they played and where they need help. Guests are not listed: only pupils who signed in with Google.</p>
   <div class="scroll"><table id="stab"><tr><th>Name</th><th>Email</th><th>Nickname</th><th>Class</th><th class="n">Games (period)</th><th class="n">Average</th><th>Weakest topic</th><th>Last seen</th></tr>
   ${rows.map(({u,n,avg,weak})=>`<tr data-u="${esc(u.id)}" data-n="${esc((u.name+' '+u.email+' '+u.nick).toLowerCase())}" style="cursor:pointer${u.id===selUid?';background:var(--soft)':''}"><td><b>${esc(u.name||'—')}</b></td><td>${esc(u.email)}</td><td>${esc(u.nick||'—')}</td><td>${esc(u.cls)}</td><td class="n">${n}</td><td class="n" style="${tone(avg)}">${avg==null?'—':avg+'%'}</td><td>${weak?`${esc(weak.topic)} <span class="pill">${weak.avg}%</span>`:'<span class="muted">—</span>'}</td><td>${fmtD(u.last)}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No one has signed in yet.</td></tr>'}</table></div>
   <div id="stud" style="margin-top:14px">${selUid?studentDetail(selUid):''}</div></div>`}
function studentDetail(uid){const u=U.find(x=>x.id===uid);if(!u)return '';const ps=PL.filter(p=>p.uid===uid),tp=topicsOf(ps),weak=tp.filter(t=>t.avg<70),good=tp.filter(t=>t.avg>=85).reverse();
  const G={};ps.forEach(p=>{const k=p.game+'|'+p.diff,g=G[k]=G[k]||{title:p.title||p.game,level:p.level||'',diff:p.diff,ps:[]};g.ps.push(p)});
  const games=Object.values(G).sort((a,b)=>b.ps[0].t-a.ps[0].t);
  const dots=r=>[...(r||'')].map(c=>`<span title="${c==='2'?'Right first time':c==='1'?'Right on the second try':'Wrong'}" style="color:${c==='2'?'var(--teal)':c==='1'?'#b7791f':'var(--bad)'}">${c==='2'?'●':c==='1'?'◐':'○'}</span>`).join('');
  return `<div style="border-top:2px solid var(--line);padding-top:14px;display:grid;gap:12px">
   <div class="row" style="justify-content:space-between"><div><span class="tag">Student</span><h2 style="margin:0">${esc(u.name||u.nick||'Student')} ${u.cls?`<span class="pill">${esc(u.cls)}</span>`:''}</h2><span class="muted">${esc(u.email)} · nickname ${esc(u.nick||'—')} · first signed in ${fmtD(u.first)} · last seen ${fmtD(u.last)}</span></div><button class="btn sm" id="sclose">Close</button></div>
   <div class="kpis">${[['Games finished',ps.length],['Average score',(v=>v==null?'—':v+'%')(avgOf(ps.map(pct).filter(v=>v!=null)))],['Topics tried',tp.length],['Topics below 70%',weak.length]].map(([a,b])=>`<div class="card kpi"><span>${a}</span><b>${b}</b></div>`).join('')}</div>
   <div class="grid2"><div class="card"><h2>Needs help with</h2>${weak.length?`<table><tr><th>Topic</th><th>Level</th><th class="n">Games</th><th class="n">Average</th></tr>${weak.map(t=>`<tr><td>${esc(t.topic)}<br><span class="muted">${esc(t.game)}</span></td><td>${esc(t.level)}</td><td class="n">${t.n}</td><td class="n" style="${tone(t.avg)}">${t.avg}%</td></tr>`).join('')}</table>`:'<p class="muted">Nothing below 70% in this period.</p>'}</div>
   <div class="card"><h2>Doing well in</h2>${good.length?`<table><tr><th>Topic</th><th>Level</th><th class="n">Games</th><th class="n">Average</th></tr>${good.map(t=>`<tr><td>${esc(t.topic)}</td><td>${esc(t.level)}</td><td class="n">${t.n}</td><td class="n" style="${tone(t.avg)}">${t.avg}%</td></tr>`).join('')}</table>`:'<p class="muted">No topic at 85% or above yet.</p>'}</div></div>
   <div class="card"><h2>By game</h2><p class="muted" style="margin:0 0 8px">"Question types" shows how often each type of question in that game was answered correctly (second-try answers count half). Low numbers show exactly what to reteach.</p><div class="scroll"><table><tr><th>Game</th><th>Level</th><th class="n">Played</th><th class="n">Average</th><th class="n">Best</th><th>Question types</th><th>Last played</th></tr>
   ${games.map(g=>{const v=g.ps.map(pct).filter(x=>x!=null),ty=typesOf(g.ps);return `<tr><td><b>${esc(g.title)}</b> <span class="pill">${esc(g.level)}</span></td><td>${esc(LVN[g.diff]||'—')}</td><td class="n">${g.ps.length}</td><td class="n" style="${tone(avgOf(v))}">${v.length?avgOf(v)+'%':'—'}</td><td class="n">${v.length?Math.max(...v)+'%':'—'}</td><td>${ty.map(q=>`<span class="pill" style="${tone(q.acc)}" title="Question type ${q.k}: ${q.n} attempt${q.n>1?'s':''}">Q${q.k} ${q.acc}%</span>`).join(' ')||'<span class="muted">—</span>'}</td><td>${fmtD(g.ps[0].t)}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">No games finished in this period.</td></tr>'}</table></div></div>
   <div class="card"><h2>Recent games</h2><div class="scroll"><table><tr><th>When</th><th>Game</th><th>Level</th><th>Mode</th><th class="n">Score</th><th>Round by round</th></tr>${ps.slice(0,60).map(p=>`<tr><td>${fmtD(p.t)}</td><td>${esc(p.title||p.game)}</td><td>${esc(LVN[p.diff]||'—')}</td><td>${esc(p.mode||'')}</td><td class="n">${p.score}${p.max?' / '+p.max:''}</td><td style="letter-spacing:2px">${dots(p.res)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No games yet.</td></tr>'}</table></div></div></div>`}
function wireStudents(){const f=$('sfind');if(f)f.oninput=()=>{const q=f.value.trim().toLowerCase();document.querySelectorAll('#stab tr[data-n]').forEach(r=>r.hidden=!!q&&!r.dataset.n.includes(q))};
  document.querySelectorAll('#stab tr[data-u]').forEach(r=>r.onclick=()=>{selUid=r.dataset.u;draw();const s=$('stud');if(s)s.scrollIntoView({behavior:'smooth',block:'start'})});
  const c=$('sclose');if(c)c.onclick=()=>{selUid=null;draw()}}

let V=[],S=[],days=7,cls='';
/* Each record read counts towards Firebase's free 50,000 reads a day, so the tracker reads at most this many visits per refresh. */
const VMAX=4000;
async function load(){const cut=Timestamp.fromMillis(Date.now()-days*864e5);SERR='';
  if(!ROLE.admin){V=[];S=[];U=[];PL=[];const cl=ROLE.classes;if(!cl.length){SERR='No classes have been assigned to you yet.';return}
    const [us,ps]=await Promise.all([getDocs(query(collection(db,'users'),where('cls','in',cl),limit(1000))),getDocs(query(collection(db,'plays'),where('cls','in',cl),limit(3000)))]);
    U=us.docs.map(mapU);PL=ps.docs.map(mapP).filter(p=>p.t>=cut.toMillis()).sort((a,b)=>b.t-a.t);return}
  await loadFeedback();
  try{const [us,ps]=await Promise.all([getDocs(query(collection(db,'users'),orderBy('last','desc'),limit(1000))),getDocs(query(collection(db,'plays'),where('ts','>=',cut),orderBy('ts','desc'),limit(3000)))]);U=us.docs.map(mapU);PL=ps.docs.map(mapP)}
  catch(e){U=[];PL=[];SERR='Could not load the student profiles ('+e.code+'). Deploy the latest firestore.rules, then press Refresh.'}
  const [v,s]=await Promise.all([getDocs(query(collection(db,'visits'),where('ts','>=',cut),orderBy('ts','desc'),limit(VMAX))),getDocs(query(collection(db,'scores'),orderBy('ts','desc'),limit(1500)))]);
  V=v.docs.map(d=>({id:d.id,...d.data(),t:d.data().ts?d.data().ts.toMillis():Date.now()}));S=s.docs.map(d=>({id:d.id,...d.data(),t:d.data().ts?d.data().ts.toMillis():Date.now()}))}
function start(u){$('app').innerHTML=`<a class="backarc" href="index.html" title="Go back to the Maths Arcade games">← Back to Maths Arcade</a><div class="top"><div><span class="tag">Maths Arcade</span><h1>Teacher tracker</h1></div><div class="row"><select id="days"><option value="1">Today</option><option value="7" selected>Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select>
  <select id="cls"><option value="">All classes</option></select>${ROLE.admin?'<button class="btn" id="csv">Download CSV</button>':''}<button class="btn" id="re">Refresh</button><button class="btn sm" id="out">Sign out ${esc(u.email)}</button></div></div><div id="body"><p class="muted">Loading data…</p></div>`;
  $('out').onclick=()=>signOut(auth).then(()=>location.reload());$('days').onchange=()=>{days=+$('days').value;refresh()};$('cls').onchange=()=>{cls=$('cls').value;draw()};$('re').onclick=refresh;if($('csv'))$('csv').onclick=csv;refresh()}
async function refresh(){$('body').innerHTML='<p class="muted">Loading data…</p>';try{await load()}catch(e){$('body').innerHTML=`<p>Could not load data: ${esc(e.message)}</p><p class="muted">If it mentions an index, open the link in the browser console once to create it.</p>`;return}
  const cs=[...new Set([...V,...S,...U].map(x=>x.cls).filter(Boolean))].sort();$('cls').innerHTML='<option value="">All classes</option>'+cs.map(c=>`<option ${c===cls?'selected':''}>${esc(c)}</option>`).join('');draw()}
const who=x=>x.nick?`${x.nick}|${x.cls||''}`:'';
function draw(){if(!ROLE.admin){$('body').innerHTML=`<div style="display:grid;gap:12px"><p class="muted" style="margin:0">You can see pupils in: ${esc(ROLE.classes.join(', ')||'no classes yet')}.</p>${studentsCard()}</div>`;wireStudents();return}
  const v=V.filter(x=>!cls||x.cls===cls),s=S.filter(x=>!cls||x.cls===cls);
  const opens=v.filter(x=>x.event==='open'),starts=v.filter(x=>x.event==='start'),fin=v.filter(x=>x.event==='finish');
  const players=new Set(v.map(who).filter(Boolean)),devices=new Set(v.map(x=>x.sid));
  // per day
  const N=Math.min(days,30),dayKey=t=>new Date(t).toLocaleDateString('en-SG',{day:'numeric',month:'short'});const D=[];for(let i=N-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);D.push({k:dayKey(d),n:0})}
  starts.forEach(x=>{const e=D.find(d=>d.k===dayKey(x.t));if(e)e.n++});const mx=Math.max(1,...D.map(d=>d.n));
  // games
  const G={};starts.forEach(x=>{(G[x.game]=G[x.game]||{s:0,f:0,sc:[]}).s++});fin.forEach(x=>{(G[x.game]=G[x.game]||{s:0,f:0,sc:[]}).f++});fin.forEach(x=>{if(x.score>=0)G[x.game].sc.push(x.score)});
  const games=Object.entries(G).sort((a,b)=>b[1].s-a[1].s);
  // classes
  const C={};v.forEach(x=>{if(!x.cls)return;const c=C[x.cls]=C[x.cls]||{p:new Set(),s:0};if(x.nick)c.p.add(x.nick);if(x.event==='start')c.s++});
  // players
  const P={};v.forEach(x=>{const k=who(x);if(!k)return;const p=P[k]=P[k]||{nick:x.nick,cls:x.cls,s:0,f:0,last:0,g:{}};if(x.event==='start'){p.s++;p.g[x.game]=(p.g[x.game]||0)+1}if(x.event==='finish')p.f++;p.last=Math.max(p.last,x.t)});
  s.forEach(x=>{const p=P[who(x)];if(p){p.best=p.best||{};p.best[x.game]=Math.max(p.best[x.game]||0,x.score)}});
  const pl=Object.values(P).sort((a,b)=>b.last-a.last);const fmtT=t=>new Date(t).toLocaleString('en-SG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  $('body').innerHTML=`<div style="display:grid;gap:12px">${V.length>=VMAX?`<p class="muted">Showing the latest ${VMAX} events only, to stay within Firebase's free daily limit. Pick a shorter period for full numbers.</p>`:''}
  <div class="kpis">${[['New feedback',FB.filter(f=>f.status!=='done').length],['Signed-in students',U.filter(x=>!cls||x.cls===cls).length],['Named players',players.size],['Devices / visits',devices.size],['Games started',starts.length],['Games finished',fin.length],['Leaderboard entries',s.length]].map(([a,b])=>`<div class="card kpi"><span>${a}</span><b>${b}</b></div>`).join('')}</div>
  ${feedbackCard()}
  ${studentsCard()}
  <div class="card"><h2>Games started per day</h2><div class="bars">${D.map(d=>`<div><i style="height:${Math.max(2,d.n/mx*140)}px"><em>${d.n||''}</em></i><small>${N>14?d.k.split(' ')[0]:d.k}</small></div>`).join('')}</div></div>
  <div class="grid2"><div class="card"><h2>Most played games</h2><div class="scroll"><table><tr><th>Game</th><th class="n">Started</th><th class="n">Finished</th><th class="n">Avg score</th></tr>${games.map(([g,o])=>`<tr><td>${esc(title(g))} <span class="pill">${esc(lvl(g))}</span></td><td class="n">${o.s}</td><td class="n">${o.f}</td><td class="n">${o.sc.length?Math.round(o.sc.reduce((a,b)=>a+b,0)/o.sc.length):'—'}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No games yet</td></tr>'}</table></div></div>
  <div class="card"><h2>Classes</h2><div class="scroll"><table><tr><th>Class</th><th class="n">Players</th><th class="n">Games started</th></tr>${Object.entries(C).sort().map(([c,o])=>`<tr><td>${esc(c)}</td><td class="n">${o.p.size}</td><td class="n">${o.s}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No classes entered yet</td></tr>'}</table></div></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Players</h2><input id="find" placeholder="Search nickname"></div><div class="scroll"><table id="ptab"><tr><th>Nickname</th><th>Class</th><th class="n">Started</th><th class="n">Finished</th><th>Most played</th><th>Last seen</th></tr>${pl.map(p=>{const top=Object.entries(p.g).sort((a,b)=>b[1]-a[1])[0];return `<tr data-n="${esc(p.nick.toLowerCase())}"><td><b>${esc(p.nick)}</b></td><td>${esc(p.cls)}</td><td class="n">${p.s}</td><td class="n">${p.f}</td><td>${top?esc(title(top[0]))+` ×${top[1]}`:'—'}</td><td>${fmtT(p.last)}</td></tr>`}).join('')||'<tr><td colspan="6" class="muted">No named players yet</td></tr>'}</table></div></div>
  <div class="grid2"><div class="card"><h2>Recent activity</h2><div class="scroll"><table><tr><th>When</th><th>Who</th><th>What</th></tr>${v.slice(0,80).map(x=>`<tr><td>${fmtT(x.t)}</td><td>${x.nick?esc(x.nick)+(x.cls?' · '+esc(x.cls):''):'<span class="muted">guest ('+esc(x.device)+')</span>'}</td><td>${{open:'Opened the arcade',start:'Started '+esc(title(x.game)),finish:'Finished '+esc(title(x.game))+(x.score>=0?` (score ${x.score})`:''),join:'Added a nickname'}[x.event]||esc(x.event)}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Leaderboard scores <span class="muted" style="font-size:14px">(delete rude names or test entries)</span></h2><div class="scroll"><table><tr><th>Player</th><th>Game</th><th>Level</th><th class="n">Score</th><th></th></tr>${s.slice(0,150).map(x=>`<tr><td><b>${esc(x.nick)}</b> ${esc(x.cls)}</td><td>${esc(x.title||title(x.game))}</td><td>${({easy:'Easy',mixed:'Medium',hard:'Hard'})[x.diff]||(x.diff?'—':'Older')}</td><td class="n">${x.score}</td><td><button class="btn sm" data-del="${x.id}">Delete</button></td></tr>`).join('')}</table></div></div></div></div>`;
  wireStudents();wireFeedback();
  $('find').oninput=()=>{const q=$('find').value.trim().toLowerCase();document.querySelectorAll('#ptab tr[data-n]').forEach(r=>r.hidden=!!q&&!r.dataset.n.includes(q))};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this score from the leaderboard?'))return;await deleteDoc(doc(db,'scores',b.dataset.del));S=S.filter(x=>x.id!==b.dataset.del);draw()})}
function csv(){const rows=[['time','event','game','nickname','class','device','visit id'],...V.map(x=>[new Date(x.t).toISOString(),x.event,title(x.game),x.nick,x.cls,x.device,x.sid])];
  const blob=new Blob([rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`arcade-usage-${days}days.csv`;a.click()}
</script></body></html>
