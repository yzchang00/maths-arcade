<title>Maths Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#5f50ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths Arcade">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: an arcade hub of topic cabinets (grouped by syllabus strand); each game opens as its own screen with a round counter, play area and a working panel. */
:root{
  --bg:#edf4f2; --surface:#ffffff; --ink:#16233a; --muted:#56667b; --line:#cddbdb; --soft:#e1eeeb;
  --teal:#0b968b; --tomato:#ef5240; --sun:#ffb81f; --violet:#5f50ec; --good:#12985a; --bad:#de3f46;
  --display:"Fredoka",ui-rounded,system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e191c; --surface:#172528; --ink:#e7f2f0; --muted:#9db2af; --line:#2a3d41; --soft:#1c3033;
  --teal:#38c4b8; --tomato:#ff7b6b; --sun:#ffc94f; --violet:#9a8fff; --good:#45d08a; --bad:#ff6f73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e191c; --surface:#172528; --ink:#e7f2f0; --muted:#9db2af; --line:#2a3d41; --soft:#1c3033;
  --teal:#38c4b8; --tomato:#ff7b6b; --sun:#ffc94f; --violet:#9a8fff; --good:#45d08a; --bad:#ff6f73; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.app{max-width:980px;margin:0 auto;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
a{color:inherit}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:700 1.3rem var(--display);display:flex;gap:10px;align-items:center;text-decoration:none}
.brand i{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--sun);color:#16233a;display:grid;place-items:center;font-size:1.1rem;transform:rotate(-6deg)}
.btn{font:800 15px var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;min-height:42px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.no{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sel{background:var(--violet);border-color:var(--violet);color:#fff}
.pill{font:800 13px var(--body);border:2px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tag{font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* hub */
.hero h1{font:700 clamp(2.2rem,7vw,3.6rem)/1 var(--display);margin:0;letter-spacing:-.01em}
.hero h1>span:not(.hl){color:var(--tomato)}
.hero p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.levels button{font:700 1.05rem var(--display);border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 18px;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.strand{display:grid;gap:12px}
.strand h2{font:600 1.15rem var(--display);margin:0;display:flex;align-items:center;gap:10px}
.strand h2::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;text-decoration:none;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;transition:border-color .15s,transform .15s}
.gcard:hover{border-color:var(--c);transform:translateY(-2px)}
.gcard .gl{width:64px;height:64px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font:700 1.6rem var(--display)}
.gcard b{font:600 1.15rem var(--display);display:block;line-height:1.2}
.gcard small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;margin-top:2px}
.gcard span.d{display:block;font-size:14px;margin-top:4px}
.gcard .best{color:var(--sun);font-size:15px;letter-spacing:2px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:20px;color:var(--muted)}
/* game screen */
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.back{font:800 15px var(--body);color:var(--ink);cursor:pointer;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;background:var(--surface)}
.ghead .tag{color:var(--c)}
.ghead h2{font:700 clamp(1.7rem,5vw,2.4rem)/1.05 var(--display);margin:2px 0 4px}
.ghead p{margin:0;color:var(--muted);max-width:62ch}
.stage{background:var(--surface);border:2px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--c);padding:18px;display:grid;gap:16px;min-width:0}
.qt{font-size:1.25rem;font-weight:800;margin:0;text-wrap:pretty}
.qs{margin:2px 0 0;color:var(--muted);font-weight:700}
#gq:empty{display:none}
.fb{border-radius:14px;padding:14px;display:grid;gap:10px;border:2px solid var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.fb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.fbt{margin:0;font:600 1.3rem var(--display);color:var(--good)}
.fb.no .fbt{color:var(--bad)}
.streak{margin:0;font-weight:800;color:var(--tomato)}
.work{display:grid;gap:6px;font-size:15.5px;overflow-x:auto}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices .btn{font:600 1.3rem var(--display);min-height:56px}
input.num{font:700 1.15rem var(--body);width:7.5em;border:2px solid var(--ink);border-radius:10px;padding:7px 10px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
svg text{font-family:var(--body)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-size:.92em;margin:0 .12em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .18em}
.whole{margin-right:.08em}
.end{display:grid;gap:14px;justify-items:start}
.end .stars{font-size:3rem;color:var(--sun);letter-spacing:6px;line-height:1}
.end h3{font:700 2rem var(--display);margin:0}
/* shared game parts */
.nl .ax,.nl .tk{stroke:var(--ink);stroke-width:3;stroke-linecap:round}.nl .tk{stroke-width:2}
.nlab{font-weight:800;font-size:17px;fill:var(--ink)}.nlab.mid{fill:var(--muted)}
.rocket{animation:land 1.1s cubic-bezier(.2,.75,.3,1) both}
@keyframes land{from{transform:translateY(-170px)}to{transform:none}}
.hboard{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:520px}
.hc{font:800 13px var(--body);aspect-ratio:1;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.hc.on{background:var(--violet);border-color:var(--violet);color:#fff}
.hc.hit{background:var(--good);border-color:var(--good);color:#fff}
.hc.miss{border:2.5px dashed var(--tomato);color:var(--tomato)}
.hc.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.frame{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:700 2rem var(--display)}
.slot,.dcard{width:54px;height:66px;border-radius:12px;font:700 2rem var(--display);display:grid;place-items:center;cursor:pointer;padding:0}
.slot{border:2.5px dashed var(--muted);background:var(--soft);color:var(--ink)}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--surface)}
.dcard{border:2.5px solid var(--ink);background:var(--sun);color:#16233a;box-shadow:3px 3px 0 var(--ink)}
.dcard:disabled{opacity:.2;box-shadow:none;cursor:default}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:600px}
@media (max-width:520px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{min-height:92px;border-radius:14px;border:2.5px solid var(--ink);background:var(--violet);color:#fff;cursor:pointer;display:grid;place-items:center;padding:6px;font:700 2rem var(--display);transition:transform .2s,background .2s}
.mcard.up{background:var(--surface);color:var(--ink);transform:rotateY(180deg) scaleX(-1)}
.mcard.got{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good);color:var(--ink);cursor:default}
.mcard .big{font-size:1.7rem}
.pies{width:100%;max-width:150px;height:auto}
.pies path{stroke:var(--ink);stroke-width:1.5}
.groups{display:flex;flex-wrap:wrap;gap:10px}
.grp{border:2.5px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:5px;max-width:150px;background:var(--surface);cursor:pointer;min-width:52px}
.grp.sel{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 14%,var(--surface))}
.grp.static{cursor:default}
.sweet{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink)}
.hand{display:flex;flex-wrap:wrap;gap:10px}
.fcard{font:600 1.7rem var(--display);min-width:74px;min-height:92px;border-radius:14px;border:2.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.fcard.sel{background:var(--sun);color:#16233a}
.fcard.ok{background:var(--good);color:#fff;border-color:var(--good)}
.fcard.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.target{font:700 1.4rem var(--display);display:inline-flex;align-items:center;gap:10px;background:var(--tomato);color:#fff;border-radius:999px;padding:6px 18px}
.bars{width:100%;max-width:420px;height:auto}
.dslots{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dslot,.dpick{font:700 1.3rem var(--display);min-width:86px;min-height:56px;border-radius:12px;padding:4px 10px;cursor:pointer;font-variant-numeric:tabular-nums}
.dslot{border:2.5px dashed var(--muted);background:var(--soft);color:var(--ink)}
.dslot.full{border-style:solid;border-color:var(--ink);background:var(--surface)}
.dslot.ok{background:var(--good);border-color:var(--good);color:#fff}.dslot.no{background:var(--bad);border-color:var(--bad);color:#fff}
.dpick{border:2.5px solid var(--ink);background:var(--teal);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.dpick:disabled{opacity:.2;box-shadow:none}
.lt{color:var(--muted);font:700 1.3rem var(--display)}
.pvt{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:16px}
.pvt th,.pvt td{border:1.5px solid var(--line);padding:3px 10px;text-align:center}
.pvt th{font-size:12px;color:var(--muted)}
.receipt{font-variant-numeric:tabular-nums;background:var(--soft);border-radius:12px;padding:12px 14px;max-width:360px;display:grid;gap:3px}
.receipt div{display:flex;justify-content:space-between;gap:20px}
.money{display:flex;flex-wrap:wrap;gap:8px}
.cash{font:800 15px var(--body);border:2px solid var(--ink);cursor:pointer;color:#16233a}
.cash.note{border-radius:8px;padding:10px 12px;background:#9fdcc4;min-width:64px}
.cash.n5{background:#c7b6f4}.cash.n10{background:#f6b3a8}.cash.n2{background:#a9c8f5}
.cash.coin{width:52px;height:52px;border-radius:50%;background:#f3d27a;padding:0}
.cash.c10,.cash.c20,.cash.c50{background:#d9dde2}
.tray{min-height:62px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ggrid{display:grid;grid-template-columns:repeat(9,minmax(0,44px));gap:2px;width:max-content;max-width:100%}
.gc{aspect-ratio:1;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;padding:0}
.gc.on{background:#5fbf73;border-color:#3c8f4f}
.readout{display:flex;flex-wrap:wrap;gap:8px}
.readout span{font:700 1.05rem var(--display);background:var(--soft);border-radius:10px;padding:4px 12px;font-variant-numeric:tabular-nums}
.readout span.hit{background:var(--good);color:#fff}
.asvg{width:100%;max-width:520px;height:auto;touch-action:none;user-select:none}
.asvg .arm{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.asvg .lab{font:800 18px var(--body);fill:var(--ink)}
.pro{fill:var(--soft);fill-opacity:.85;stroke:var(--ink);stroke-width:1.5}
.ptk{stroke:var(--ink);stroke-width:1}
.pin{font-size:8.5px;font-weight:800;fill:var(--teal)}.pout{font-size:8.5px;font-weight:800;fill:var(--tomato)}
.msvg{width:100%;max-width:380px;height:auto}
.msvg rect.c{fill:var(--surface);stroke:var(--line);stroke-width:1.5;cursor:pointer}
.msvg rect.src{fill:var(--violet);stroke:var(--violet)}
.msvg rect.on{fill:var(--teal);stroke:var(--teal)}
.msvg rect.miss{fill:var(--surface);stroke:var(--tomato);stroke-width:3;stroke-dasharray:5 3}
.msvg rect.bad{fill:var(--bad);stroke:var(--bad)}
.mline{stroke:var(--tomato);stroke-width:4;stroke-dasharray:10 6}
.nsvg{width:100%;max-width:340px;height:auto}
.nsvg .sq{stroke:var(--ink);stroke-width:2.5;fill:var(--sun)}
.nsvg .tl{font:800 15px var(--body);fill:#16233a}
.gsvg{width:100%;height:auto;max-width:600px}
.gsvg .grid{stroke:var(--line);stroke-width:1}
.gsvg .axl{font-size:12px;fill:var(--muted);font-weight:700}
.gsvg .ln{stroke:var(--teal);stroke-width:3.5;fill:none}
.gsvg .pt{fill:var(--surface);stroke:var(--teal);stroke-width:3}
.gsvg .hitp,.gsvg .hits{cursor:pointer}
.gsvg .hits{stroke:transparent;stroke-width:24}
.gsvg .hitp{fill:transparent}
.gsvg .seg.ok{stroke:var(--good);stroke-width:7}.gsvg .seg.no{stroke:var(--bad);stroke-width:7}
.gsvg .pt.ok{fill:var(--good);stroke:var(--good)}.gsvg .pt.no{fill:var(--bad);stroke:var(--bad)}
.psvg{width:100%;max-width:480px;height:auto}
.psvg .pl.plout{fill:var(--ink)}
.psvg .pl{font-size:12.5px;font-weight:800;fill:#16233a}
.fold3d{height:300px;max-width:460px;perspective:820px;display:grid;place-items:center;overflow:hidden;background:var(--soft);border-radius:14px}
.scene{position:relative;width:0;height:0;transform-style:preserve-3d}
.face{position:absolute;width:56px;height:56px;transform-style:preserve-3d;box-shadow:inset 0 0 0 2px #16233a;backface-visibility:visible}
.dials{display:flex;flex-wrap:wrap;gap:5px}
.dial{display:grid;justify-items:center;gap:3px;background:var(--soft);border-radius:12px;padding:5px 3px;min-width:46px}
.dial.grp{margin-right:8px}.dial .btn{min-height:30px;padding:2px 8px;font-size:12px}
.dv{font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}.dial small{font-weight:800;font-size:11px;color:var(--muted)}
.choices.one{grid-template-columns:1fr}.choices.one .btn{font:700 1rem var(--body);text-align:left;min-height:48px}
.hist{display:grid;gap:2px;font:600 1.15rem var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.expr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:700 2rem var(--display);font-variant-numeric:tabular-nums}
.expr .eq{color:var(--muted)}
.opb{font:700 1.8rem var(--display);width:52px;height:52px;border-radius:12px;border:2.5px solid var(--ink);background:var(--sun);color:#16233a;cursor:pointer;box-shadow:3px 3px 0 var(--ink);padding:0}
.opb.no{background:var(--bad);color:#fff;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pvchart{display:grid;grid-template-columns:repeat(4,minmax(38px,1fr)) minmax(38px,1fr) 16px repeat(3,minmax(38px,1fr));min-width:360px;max-width:520px;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.pvh,.pvd{text-align:center;border-left:1.5px solid var(--line);padding:4px 0}
.pvh{font:800 12px var(--body);color:var(--muted);background:var(--soft)}
.pvd{font:700 1.9rem var(--display);min-height:52px;display:grid;place-items:center}
.pvh.dot,.pvd.dot{border-left:0;font-weight:800}
.stepper{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:12px;padding:4px 8px;font-weight:800}
.stepper b{font:700 1.4rem var(--display);min-width:1.2em;text-align:center}
.stepper .btn{min-height:34px;padding:2px 12px}
.retry{margin:0 0 10px;font:600 1.15rem var(--display);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:2px solid var(--bad);border-radius:12px;padding:8px 12px}
.stage.shake{animation:shake .4s}
.cups{display:flex;flex-wrap:wrap;gap:4px}
.cup{width:24px;height:34px;border:2px solid #16233a;border-top:0;border-radius:0 0 8px 8px;background:linear-gradient(to top,var(--f) 75%,transparent 75%)}
.cup.syr{--f:#e86a3a}.cup.wat{--f:#7fc4f2}
.umodel{display:grid;gap:8px;max-width:460px}.urow{display:grid;grid-template-columns:60px 1fr;align-items:center;gap:8px}
.ubar{display:flex}.ubar span{width:46px;height:32px;border:2px solid #16233a;margin-left:-2px;display:grid;place-items:center;font-weight:800;color:#16233a}
.utot{font-weight:800;color:var(--muted)}
.towers{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;min-height:250px}
.tower{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;background:none;border:2px dashed transparent;border-radius:12px;padding:4px 6px;cursor:pointer;color:var(--ink);font:inherit}
.tower.sel{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,transparent)}
.tower i{display:block;width:40px;height:16px;border:1.5px solid #16233a;border-radius:3px}
.tower b{order:-1;font-size:13px;margin-top:4px}.tower .tv{font:700 1.1rem var(--display)}
.lvl button{font-size:.95rem;padding:4px 14px}
.mode button{font-size:.95rem;padding:4px 14px}
.vs{display:flex;flex-wrap:wrap;gap:8px}.vsp{display:inline-flex;gap:8px;align-items:baseline;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font:600 1.05rem var(--display);font-variant-numeric:tabular-nums}
.vsp.me{border-color:var(--c,var(--violet));box-shadow:0 0 0 2px var(--c,var(--violet)) inset}.vsp small{font:700 12px var(--body);color:var(--muted)}
.botline{margin:0;font-weight:800;color:var(--violet)}.turn{margin:0 0 8px;font:600 1.2rem var(--display);color:var(--c)}
.board{list-style:none;margin:0;padding:0;display:grid;gap:6px;min-width:min(100%,320px)}.board li{display:flex;justify-content:space-between;gap:20px;background:var(--soft);border-radius:10px;padding:8px 14px;font-variant-numeric:tabular-nums}
.board li:first-child{background:color-mix(in srgb,var(--sun) 35%,var(--surface))}.board li.me{outline:2px solid var(--violet)}
.code{font-family:ui-monospace,monospace;letter-spacing:.15em;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 10px}
.shop{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(170px,230px);gap:12px;align-items:end;background:linear-gradient(to bottom,color-mix(in srgb,var(--sun) 18%,var(--surface)) 0 70%,#b98a5c 70% 100%);border:2.5px solid var(--ink);border-radius:16px;padding:12px;overflow:hidden}
@media (max-width:640px){.shop{grid-template-columns:auto minmax(0,1fr)}.shop .pos{grid-column:1/-1}.cust{flex-direction:column;align-items:center}.cust .say{position:static;order:-1;white-space:normal;max-width:120px;margin-bottom:4px;font-size:.8rem}.paynote{left:30px;bottom:30px}}
.cust{display:flex;align-items:flex-end;gap:2px;position:relative}.kid{width:92px;height:auto}
.say{position:absolute;top:-6px;left:70px;background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:3px 9px;font:600 .9rem var(--display);white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
